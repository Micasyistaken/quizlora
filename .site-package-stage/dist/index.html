<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quizlora</title>
<meta name="description" content="Quizlora: Çöz, öğren, yarış.">
<style>
:root{--pu:#5C50F1;--pu2:#4A3FE0;--sun:#FFB548;--mint:#36CFA8;--ink:#19172F;--bg:#F6F6FE;--card:#FFFFFF;--soft:#EEECFF;--txt:#19172F;--mut:#5E5B7A;--line:#E3E1F7;--red:#D93A40;--lnk:#4A3FE0;--sh:0 10px 30px rgba(92,80,241,.12);--r:26px;--blob:#E6E3FF;color-scheme:light;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#19172F;--card:#242046;--soft:#322D5E;--txt:#F1F0FF;--mut:#B6B3D6;--line:#403A6E;--lnk:#A29AFF;--sh:0 10px 30px rgba(0,0,0,.35);--blob:#26214F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#19172F;--card:#242046;--soft:#322D5E;--txt:#F1F0FF;--mut:#B6B3D6;--line:#403A6E;--lnk:#A29AFF;--sh:0 10px 30px rgba(0,0,0,.35);--blob:#26214F;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:16px/1.5 "Segoe UI",Inter,system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;right:-160px;top:-180px;width:460px;height:460px;border-radius:50%;background:var(--blob);z-index:-1}
h1,h2,h3{font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 .4em}
h1{font-size:clamp(2rem,6vw,3.2rem)}h2{font-size:1.45rem}h3{font-size:1.1rem}
a{color:var(--lnk)}
p{margin:0 0 .8em}
.mut{color:var(--mut)}.sm{font-size:.88rem}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--lnk);margin:0 0 .6em}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
main{padding:18px 0 24px;min-height:70vh}
/* üst çubuk */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--txt);font-weight:800;font-size:1.35rem;letter-spacing:-.03em}
.brand svg{width:38px;height:38px}
.dnav{display:none;gap:2px;margin-left:12px;flex:1}
.dnav a{padding:9px 13px;border-radius:12px;color:var(--mut);text-decoration:none;font-weight:700;font-size:.95rem}
.dnav a:hover{background:var(--soft)}.dnav a.on{background:var(--soft);color:var(--lnk)}
.tright{margin-left:auto;display:flex;align-items:center;gap:8px}
.ibtn{width:44px;height:44px;border-radius:14px;border:0;background:var(--soft);color:var(--txt);font-size:1.15rem;cursor:pointer;display:grid;place-items:center;text-decoration:none}
.chipc{display:inline-flex;align-items:center;gap:6px;background:var(--soft);padding:8px 12px;border-radius:999px;font-weight:800;font-size:.92rem;text-decoration:none;color:var(--txt)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;text-decoration:none;color:var(--mut);font-size:.72rem;font-weight:700;min-height:52px;justify-content:center}
.bnav a b{font-size:1.3rem;line-height:1}
.bnav a.on{color:var(--lnk);background:var(--soft)}
@media(min-width:900px){.dnav{display:flex}.bnav{display:none}.mob-only{display:none!important}}
/* bileşenler */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px;border:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.sec{margin-top:34px}
.sec>.row{margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:2px solid transparent;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;background:var(--soft);color:var(--txt)}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--pu);color:#fff;box-shadow:0 8px 18px rgba(92,80,241,.3)}
.btn.sun{background:var(--sun);color:var(--ink)}
.btn.mint{background:var(--mint);color:var(--ink)}
.btn.out{background:transparent;border-color:var(--line)}
.btn.sm{min-height:38px;padding:0 14px;font-size:.88rem;border-radius:11px}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
.sech{font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--lnk);margin:0}
.hero{padding:26px 0 8px}
.herogrid{display:grid;gap:22px;align-items:center}
@media(min-width:900px){.herogrid{grid-template-columns:1.2fr 1fr}}
.brandcards{display:grid;gap:14px}
.bw{display:flex;align-items:center;gap:18px;min-height:150px}
.wm{font-size:clamp(2.2rem,7vw,3rem);font-weight:800;letter-spacing:-.05em;line-height:1}
.tg{color:var(--mut);margin-top:8px}
.bd{background:#19172F;display:grid;place-items:center;min-height:160px}
@media(max-width:699px){.bd{display:none}}
.foot{padding-top:6px;padding-bottom:110px;color:var(--mut);font-size:.92rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(min-width:900px){.foot{padding-bottom:40px}}
.lead{font-size:1.15rem;color:var(--mut);max-width:34em}
.search{display:flex;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:8px;box-shadow:var(--sh);margin-top:18px;max-width:720px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:1.1rem;padding:0 12px;color:var(--txt);min-height:52px}
.search input:focus{outline:none}.search:focus-within{border-color:var(--pu)}
.qc{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r);background:var(--card);border:0;box-shadow:var(--sh);text-decoration:none;color:var(--txt)}
.qc:hover,.catc:hover{box-shadow:0 0 0 2px var(--pu),var(--sh)}
.qrow{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:18px;padding:12px}
.qmark{flex:none;width:42px;height:42px;border-radius:50%;background:var(--pu);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.15rem}
.qbtn{width:100%;pointer-events:none}
.ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;background:color-mix(in srgb,var(--c,#5C50F1) 18%,var(--card))}
.catc{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);background:var(--card);border:0;box-shadow:var(--sh);text-decoration:none;color:var(--txt);font-weight:800;min-height:72px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--soft);font-size:.78rem;font-weight:700;color:var(--mut)}
.tag.ok{background:color-mix(in srgb,var(--mint) 30%,var(--card));color:var(--txt)}
.pill{display:inline-flex;align-items:center;padding:9px 14px;border-radius:999px;background:var(--soft);text-decoration:none;color:var(--txt);font-weight:700;font-size:.92rem}
.pill:hover{background:var(--pu);color:#fff}
.mode{display:flex;flex-direction:column;gap:8px;padding:20px;border-radius:var(--r);text-decoration:none;color:var(--ink);min-height:150px}
.mode b{font-size:1.25rem;letter-spacing:-.02em}.mode span{font-size:.92rem;opacity:.85}.mode .e{font-size:2rem}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:14px 0 18px;scrollbar-width:thin}
.tabs a,.tabs button{flex:none;padding:10px 16px;border-radius:12px;background:var(--soft);color:var(--mut);text-decoration:none;font-weight:800;font-size:.92rem;border:0;font-family:inherit;cursor:pointer;min-height:44px}
.tabs .on{background:var(--pu);color:#fff}
input,select,textarea{font:inherit;color:var(--txt);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:11px 13px;min-height:46px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pu)}
label{display:block;font-weight:700;margin:12px 0 6px;font-size:.92rem}
.form{max-width:440px;margin:20px auto}
.err{color:var(--red);font-weight:700;min-height:1.4em}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:.92rem}
.tw{overflow-x:auto}
.empty{text-align:center;padding:34px 16px;color:var(--mut)}
/* quiz oynatıcı */
.run{max-width:760px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pu),var(--mint));border-radius:99px;transition:width .3s}
.clock{font-weight:800;font-size:1.1rem;background:var(--sun);color:var(--ink);padding:6px 14px;border-radius:999px;font-variant-numeric:tabular-nums}
.clock.low{background:var(--red);color:#fff}
.qt{font-size:clamp(1.3rem,4.5vw,1.8rem);margin:6px 0 20px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:60px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
.opt:hover{border-color:var(--pu)}
.opt i{flex:none;width:34px;height:34px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-style:normal;font-weight:800;color:var(--lnk)}
.opt.sel{border-color:var(--pu);background:var(--soft)}
.opt.sel i{background:var(--pu);color:#fff}
.opt.good{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 22%,var(--card))}
.opt.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 14%,var(--card))}
.opt[disabled]{cursor:default}
.acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.acts .grow{flex:1}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px}
.dots button{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--txt);font-weight:800;cursor:pointer}
.dots .done{background:var(--soft);border-color:var(--pu)}.dots .cur{background:var(--pu);color:#fff;border-color:var(--pu)}
.fb{margin-top:14px;padding:14px;border-radius:14px;background:var(--soft)}
.rev{padding:14px 0;border-bottom:1px solid var(--line)}
.score{font-size:3rem;font-weight:800;letter-spacing:-.04em}
.pop{position:fixed;left:50%;top:40%;font-size:4rem;pointer-events:none;animation:pop 1s ease-out forwards;z-index:60}
@keyframes pop{0%{transform:translate(-50%,0) scale(.5);opacity:0}30%{opacity:1;transform:translate(-50%,-20px) scale(1.2)}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
/* yolculuk */
.path{display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 0}
.stone{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.3rem;background:var(--soft);color:var(--mut);border:4px solid var(--line);position:relative;text-align:center;line-height:1.1}
.stone small{display:block;font-size:.66rem;font-weight:700}
.stone.done{background:var(--mint);color:var(--ink);border-color:var(--mint)}
.stone.cur{background:var(--pu);color:#fff;border-color:var(--sun);box-shadow:0 0 0 6px color-mix(in srgb,var(--sun) 35%,transparent)}
.stone.cool{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.stone.final{border-radius:26px}
.seg{width:6px;height:26px;background:var(--line);border-radius:3px}
.seg.d{background:var(--mint)}
.lv{display:flex;flex-direction:column;align-items:center}
/* mağaza / önizleme */
.pv{height:110px;border-radius:16px;display:grid;place-items:center;font-size:2.4rem;overflow:hidden;position:relative}
.av{display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--pu),var(--mint));color:#fff;flex:none}
.modal{position:fixed;inset:0;background:rgba(10,8,30,.55);z-index:50;display:grid;place-items:center;padding:18px}
.modal .card{max-width:440px;width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:70;max-width:90vw;box-shadow:var(--sh)}
.meter{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}.meter i{display:block;height:100%;background:var(--pu);border-radius:99px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.zoom{animation:zoomin .7s ease-out}.slide{animation:slidein .7s ease-out}.spin{animation:spin .8s ease-out}
@keyframes zoomin{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes slidein{from{transform:translateX(-80px);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{from{transform:rotate(-200deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.spinner{width:46px;height:46px;border-radius:50%;border:5px solid var(--soft);border-top-color:var(--pu);animation:rot 1s linear infinite;margin:0 auto}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

/* ================= yardımcılar ================= */

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmtD=t=>new Date(t).toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'});

const weekStart=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));d.setHours(0,0,0,0);return d};
const weekKey=()=>{const d=weekStart();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('qz:'+t)))].map(b=>b.toString(16).padStart(2,'0')).join('');

const QZ=[

['Osmanlı Padişahları','Tarih','Osmanlı tarihi'],['Antik Roma','Tarih','İlk Çağ'],

const GROUP_NAMES=[

function seed(){
  const cats=[];let n=0;
  TREE.forEach(([nm,ic,co,subs])=>{const id='c'+(++n);cats.push({id,n:nm,i:ic,c:co,p:null});subs.forEach(s=>cats.push({id:'c'+(++n),n:s,i:ic,c:co,p:id}))});
  const mains=cats.filter(c=>!c.p);
  const find=(m,s)=>{const M=mains.find(c=>c.n===m);return cats.find(c=>c.p===M.id&&c.n===s)};
  const quizzes=QZ.map(([t,m,s],k)=>{
    const id='q'+(k+1),sub=find(m,s),mid=sub.p;
    return {id,t,cat:sub.id,ver:1,feat:k<6,plays:0,at:k,st:'yayin',

function rec(q,ok){
  const u=U();if(!u)return;
  const up=[0,5,7,9][q.d||1],dn=[0,3,4,5][q.d||1];
  u.skill=Math.max(0,Math.min(3000,u.skill+(ok?up:-dn)));
  const c=u.cat[q.cat]||(u.cat[q.cat]={a:0,c:0});c.a++;if(ok)c.c++;

  u.log.push({t:Date.now(),c:q.cat,q:q.id,ok:ok?1:0});if(u.log.length>4000)u.log.shift();

function optsHtml(q,S,c){
  const i=S.i,typed=c.typed;
  if(typed){const v=c.back?(S.ans[i]||''):'';return `<input id="typed" type="text" autocomplete="off" placeholder="Cevabını yaz" aria-label="Cevabın" value="${esc(v)}" ${S.fb?'disabled':''}>`}
  return `<div class="opts" role="group" aria-label="Cevap seçenekleri">${q.o.map((o,k)=>{
    let cls='';
    if(S.fb){cls=k===q.a?'good':(k===S.ans[i]?'bad':'')}
    else if(c.back?S.ans[i]===k:S.sel===k)cls='sel';
    return `<button class="opt ${cls}" data-a="pick" data-v="${k}" ${S.fb?'disabled':''}><i>${LET[k]}</i>${esc(o)}</button>`}).join('')}</div>`;
}
function play(c){
  const n=c.qs.length;
  const S={i:0,ans:Array(n).fill(null),sel:null,fb:false,end:c.limit?Date.now()+c.limit*1000:0,done:false,failed:false,t:0};
  if(c.resume){S.i=Math.min(c.resume.i,n-1);S.ans=c.resume.ans.slice();}
  const isOk=k=>{const a=S.ans[k],q=c.qs[k];if(a==null||a==='')return false;return c.typed?norm(a)===norm(q.o[q.a]):a===q.a};
  function end(reason){
    if(S.done)return;S.done=true;clearInterval(S.t);CUR=null;
    c.onEnd({ans:S.ans,ok:c.qs.map((_,k)=>isOk(k)),reason});
  }
  function draw(){
    const q=c.qs[S.i];if(c.onShow&&!S.fb)c.onShow(q);
    const last=S.i===n-1;
    let h=`<div class="run"><div class="qhead"><div><b>${esc(c.title)}</b><br><span class="mut sm">Soru ${S.i+1} / ${n}</span></div>${S.end?'<div class="clock" id="clk" role="timer"></div>':''}</div>
     <div class="bar"><i style="width:${(S.i+(S.fb?1:0))/n*100}%"></i></div>
     <div class="card"><h2 class="qt">${esc(q.q)}</h2>${optsHtml(q,S,c)}`;
    if(S.fb){h+=`<div class="fb" role="status"><b>${S.failed?'Yanlış cevap':(isOk(S.i)?'Doğru!':'Yanlış cevap')}</b><br>Doğru cevap: ${esc(q.o[q.a])}<br><span class="mut">${esc(q.e)}</span></div>`}
    h+='<div class="acts">';
    if(c.back){
      h+=`${S.i>0?'<button class="btn out" data-a="prev">Önceki</button>':''}<button class="btn out" data-a="skip">Pas</button><span class="grow"></span>${last?'<button class="btn pri" data-a="fin">Sınavı bitir</button>':'<button class="btn pri" data-a="next">Sonraki</button>'}`;
    }else if(S.fb){
      h+=`<button class="btn pri grow" data-a="next">${S.failed?'Devam':(last?'Bitir':'Sonraki soru')}</button>`;
    }else{
      h+=`<button class="btn pri grow" data-a="send" ${(c.typed?false:S.sel==null)?'disabled':''} id="sendb">Cevabı gönder</button>`;
    }
    h+='</div></div>';
    if(c.back){h+=`<div class="dots" aria-label="Soru gezgini">${c.qs.map((_,k)=>`<button data-a="go" data-v="${k}" class="${k===S.i?'cur':(S.ans[k]!=null&&S.ans[k]!==''?'done':'')}" aria-label="Soru ${k+1}">${k+1}</button>`).join('')}</div>`}
    h+='</div>';
    setApp(h);
    if(c.typed){const inp=$('#typed');if(inp){inp.addEventListener('input',()=>{if(c.back)S.ans[S.i]=inp.value;else S.sel=inp.value});inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!c.back)CUR.send()});if(!S.fb)inp.focus()}}
    tick();
  }
  function tick(){
    const el=$('#clk');if(!el||!S.end)return;
    const s=(S.end-Date.now())/1000;el.textContent='⏱ '+fmtT(s);el.classList.toggle('low',s<30);
    if(s<=0)end('time');
  }
  function adv(){if(S.i>=n-1)end('done');else{S.i++;S.sel=null;S.fb=false;draw()}}
  CUR={
    abort(){clearInterval(S.t);if(!S.done&&c.onAbort)c.onAbort(S)},
    pick(k){if(S.fb)return;if(c.back){S.ans[S.i]=k}else S.sel=k;draw()},
    send(){
      if(S.fb)return;const v=S.sel;if(v==null||v==='')return;
      S.ans[S.i]=v;const ok=isOk(S.i);
      if(c.onProgress)c.onProgress(S);
      if(c.instant){
        S.fb=true;S.failed=!!(c.failFast&&!ok);
        if(ok){const fx=eqItem(U(),'fx');if(fx)pulse(fx.d.e)}
        draw();
      }else adv();
    },
    next(){if(c.back){if(S.i<n-1){S.i++;draw()}}else if(S.failed)end('wrong');else adv()},
    prev(){if(S.i>0){S.i--;draw()}},
    skip(){S.ans[S.i]=null;if(S.i<n-1){S.i++;draw()}else draw()},
    go(k){S.i=k;draw()},
    fin(){const blank=S.ans.filter(a=>a==null||a==='').length;if(blank){confirmBox('Sınavı bitir',blank+' soru boş kaldı. Bitirmek istiyor musun?','Evet, bitir',()=>end('done'))}else end('done')}
  };
  if(S.end)S.t=setInterval(tick,500);
  draw();
}
function pulse(e){const p=document.createElement('div');p.className='pop';p.textContent=e;document.body.appendChild(p);setTimeout(()=>p.remove(),1000)}
A.pick=t=>CUR&&CUR.pick(+t.dataset.v);A.send=()=>CUR&&CUR.send();A.next=()=>CUR&&CUR.next();A.prev=()=>CUR&&CUR.prev();
A.skip=()=>CUR&&CUR.skip();A.go=t=>CUR&&CUR.go(+t.dataset.v);A.fin=()=>CUR&&CUR.fin();

    onEnd:res=>finishQuiz(q,res)});

function finishQuiz(q,res){
  const u=U(),n=q.qs.length,c=res.ok.filter(Boolean).length,rec0={t:Date.now(),c,n,ver:q.ver};
  let credits=0,first=false;
  q.plays++;
  if(u){
    const d=u.done[q.id]||(u.done[q.id]={runs:[],paid:false});
    first=d.runs.length===0;d.runs.push(rec0);
    if(first&&!d.paid){credits=c;u.credits+=c;d.paid=true}
    q.qs.forEach((x,k)=>rec(x,res.ok[k]));
    u.resume=null;bump('quiz');act(u,q.t+' quizini tamamladı ('+c+'/'+n+')');touchDay(u);checkBadges();
  }else{const d=G.done[q.id]||(G.done[q.id]={runs:[]});d.runs.push(rec0);saveG()}
  save();chrome();
  setApp(`<div class="run"><div class="card" style="text-align:center"><p class="eyebrow">Quiz tamamlandı</p><h1>${esc(q.t)}</h1>${scoreRing(c,n)}
   ${u?(credits?`<p><span class="tag ok">🪙 +${credits} kredi</span></p>`:`<p class="mut">${first?'Doğru cevabın olmadığı için kredi yok.':'Tekrar çözümler kredi vermez; sonucun arşive eklendi.'}</p>`):'<p class="mut">Misafir olarak çözdün. Tamamlanma bilgisi yalnızca bu açık oturumda tutulur. Kredi ve arşiv için hesap aç.</p>'}
   <div class="row" style="justify-content:center"><a class="btn pri" href="#/oyna/${q.id}">Tekrar çöz</a><a class="btn out" href="#/quiz/${q.id}">Quiz sayfası</a><a class="btn out" href="#/kesfet">Keşfet</a></div></div>
   ${section('Doğru cevaplar ve açıklamalar','<div class="card">'+reviewHtml(q.qs,res)+'</div>')}</div>`);
}

V.sonsuz=id=>{
  if(!id){
    setApp(`<div class="form card"><p class="eyebrow">Sonsuz test</p><h1>Konunu seç</h1><p class="mut">Ortak soru havuzundan art arda soru gelir. Zorluk performansına göre ayarlanır. Aynı soru sık gelmez.</p><label for="tp">Konu</label>${topicSelect('tp')}<div style="margin-top:16px"><button class="btn pri" id="go">Başla</button></div></div>`);
    $('#go').onclick=()=>go('#/sonsuz/'+$('#tp').value);return;
  }
  const pool=poolOf(id);if(!pool.length)return V.nf();
  const title=id==='mix'?'Genel Kültür karma':(cat(id)?cat(id).n:'Sonsuz test');
  const u=U(),store=u||G;store.seen=store.seen||{};
  const S={n:0,c:0,recent:[],diff:u?(u.skill<950?1:u.skill<1100?2:3):2,by:{},cur:null,fb:false,sel:null,earned:0};
  CUR={abort(){}};
  function pick(){
    const seen=store.seen;
    let cand=pool.filter(q=>!seen[q.id]&&q.d===S.diff);
    if(!cand.length)cand=pool.filter(q=>!seen[q.id]).sort((a,b)=>Math.abs(a.d-S.diff)-Math.abs(b.d-S.diff)).filter((q,_,a)=>Math.abs(q.d-S.diff)===Math.abs(a[0].d-S.diff));
    if(!cand.length)cand=[...pool].sort((a,b)=>(seen[a.id]||0)-(seen[b.id]||0)).slice(0,5);
    return rnd(cand);
  }
  function draw(){
    const q=S.cur;
    setApp(`<div class="run"><div class="qhead"><div><b>${esc(title)}</b><br><span class="mut sm">${S.n} çözüldü · ${S.c} doğru</span></div><span class="tag">Zorluk: ${['','Kolay','Orta','Zor'][S.diff]}</span></div>
     <div class="card"><h2 class="qt">${esc(q.q)}</h2><div class="opts">${q.o.map((o,k)=>`<button class="opt ${S.fb?(k===q.a?'good':(k===S.sel?'bad':'')):(k===S.sel?'sel':'')}" data-a="ipick" data-v="${k}" ${S.fb?'disabled':''}><i>${LET[k]}</i>${esc(o)}</button>`).join('')}</div>
     ${S.fb?`<div class="fb" role="status"><b>${S.sel===q.a?'Doğru!':'Yanlış cevap'}</b><br>Doğru cevap: ${esc(q.o[q.a])}<br><span class="mut">${esc(q.e)}</span><br>${S.note?`<span class="tag ok">${S.note}</span>`:''}</div>`:''}
     <div class="acts">${S.fb?'<button class="btn pri grow" data-a="inext">Sonraki soru</button>':'<button class="btn pri grow" data-a="isend" '+(S.sel==null?'disabled':'')+'>Cevabı gönder</button>'}<button class="btn out" data-a="ifin">Oturumu bitir</button></div></div></div>`);
  }
  function nextQ(){S.cur=pick();S.sel=null;S.fb=false;S.note='';draw()}
  CUR={
    abort(){},
    ipick(k){if(!S.fb){S.sel=k;draw()}},
    isend(){
      if(S.fb||S.sel==null)return;const q=S.cur,ok=S.sel===q.a;
      S.fb=true;S.n++;if(ok)S.c++;
      store.seen[q.id]=Date.now();
      const m=mainOf(q.cat);S.by[m.id]=S.by[m.id]||{a:0,c:0};S.by[m.id].a++;if(ok)S.by[m.id].c++;
      S.recent.push(ok);S.recent=S.recent.slice(-5);
      if(S.recent.length===5){const r=S.recent.filter(Boolean).length;if(r>=4){S.diff=Math.min(3,S.diff+1);S.recent=[]}else if(r<=1){S.diff=Math.max(1,S.diff-1);S.recent=[]}}
      if(u){rec(q,ok);if(ok&&!u.credited[q.id]){u.credited[q.id]=1;u.credits+=1;S.earned++;S.note='🪙 +1 kredi (ilk doğru)'}else if(ok)S.note='Bu soruyu daha önce doğru çözdün: kredi yok';bump('inf');save();chrome()}
      if(ok){const fx=eqItem(u,'fx');if(fx)pulse(fx.d.e)}
      draw();
    },
    inext(){nextQ()},
    ifin(){
      CUR=null;if(u){checkBadges()}
      const rows=Object.entries(S.by).map(([k,v])=>`<tr><td>${esc(cat(k).n)}</td><td>${v.c}/${v.a}</td><td>%${Math.round(v.c/v.a*100)}</td></tr>`).join('');
      setApp(`<div class="run"><div class="card" style="text-align:center"><p class="eyebrow">Oturum özeti</p><h1>${esc(title)}</h1>${S.n?scoreRing(S.c,S.n):'<p class="mut">Hiç soru çözmedin.</p>'}<p class="mut">Çözülen soru: ${S.n} · Kazanılan kredi: ${u?S.earned:'hesapla kazanılır'}</p>
       ${rows?`<div class="tw"><table><tr><th>Konu</th><th>Doğru</th><th>Oran</th></tr>${rows}</table></div>`:''}
       <div class="row" style="justify-content:center;margin-top:14px"><a class="btn pri" href="#/sonsuz/${id}">Yeni oturum</a><a class="btn out" href="#/modlar">Modlar</a></div></div></div>`);
    }
  };
  nextQ();
};

V.sinav=id=>{
  setApp(`<div class="form card"><p class="eyebrow">Süreli sınav</p><h1>25 soruluk sınav</h1><p class="mut">Pas geçebilir, önceki sorulara dönüp cevabını değiştirebilirsin. Süre dolunca sınav otomatik biter.</p>
   <label for="tp">Konu</label>${topicSelect('tp',id)}
   <label for="df">Zorluk</label><select id="df"><option value="1">Kolay (12 dakika)</option><option value="2" selected>Normal (10 dakika)</option><option value="3">Zor (8 dakika)</option></select>
   <label><input type="checkbox" id="ty" style="width:auto;min-height:0;margin-right:8px">Ek zorluk: şıksız, cevabı yazarak ver</label>
   <div style="margin-top:16px"><button class="btn pri" id="go">Sınavı başlat</button></div></div>`);
  if(id&&$('#tp'))$('#tp').value=id;
  $('#go').onclick=()=>{
    const v=$('#tp').value,df=+$('#df').value,typed=$('#ty').checked,pool=poolOf(v);
    if(!pool.length)return toast('Bu konuda soru bulunamadı.');
    const want=q=>df===1?q.d<=2:df===3?q.d>=2:true;
    let qs=shuffle(pool.filter(want)).slice(0,25);
    if(qs.length<25)qs=qs.concat(shuffle(pool.filter(q=>!qs.includes(q))).slice(0,25-qs.length));
    const mins=[0,12,10,8][df],u=U();
    play({qs,title:'Süreli sınav',back:true,typed,limit:mins*60,
      onEnd:res=>{
        const c=res.ok.filter(Boolean).length;let earned=0;
        if(u){qs.forEach((q,k)=>{rec(q,res.ok[k]);if(res.ok[k]&&!u.credited[q.id]){u.credited[q.id]=1;u.credits++;earned++}});bump('exam');act(u,'Süreli sınav: '+c+'/25');checkBadges();save();chrome()}
        setApp(`<div class="run"><div class="card" style="text-align:center"><p class="eyebrow">${res.reason==='time'?'Süre doldu':'Sınav bitti'}</p><h1>Sonucun</h1>${scoreRing(c,25)}
         ${u?`<p class="mut">İlk kez doğru bildiğin sorulardan ${earned} kredi kazandın.</p>`:'<p class="mut">Kredi için hesap aç.</p>'}
         <div class="row" style="justify-content:center"><a class="btn pri" href="#/sinav">Yeni sınav</a><a class="btn out" href="#/modlar">Modlar</a></div></div>
         ${section('Doğru cevaplar ve açıklamalar','<div class="card">'+reviewHtml(qs,res,typed)+'</div>')}</div>`);
      }});
  };
};

V.yolculuk=()=>{
  const u=U();
  if(!u)return setApp(`<div class="form card" style="text-align:center"><p class="eyebrow">Yolculuk</p><h1>İlerlemeni saklamak için giriş yap</h1><p class="mut">Yolculukta taşların ve seviyen hesabına kaydedilir.</p><a class="btn pri" href="#/giris">Giriş yap</a> <a class="btn out" href="#/kayit">Hesap aç</a></div>`);
  if(u.j.active){journeyFail(u);toast('Yarım bıraktığın deneme yanlış sayıldı.')}
  const j=u.j,now=Date.now(),L=j.level,cool=j.cool>now;
  const st=eqItem(u,'stone'),sty=st?`background:${st.d.c};border-radius:${st.d.r};border-color:${st.d.c};color:var(--ink)`:'';
  let lv='';
  for(let s=5;s>=1;s--){
    const state=s<j.stone?'done':s===j.stone?(cool?'cool':'cur'):'';
    lv+=`<div class="stone ${state} ${s===5?'final':''}" style="${state==='done'&&sty?sty:''}" aria-label="Taş ${s}, ${state==='done'?'geçildi':state==='cur'?'şu anki taş':state==='cool'?'bekleme':'kilitli'}">${state==='done'?'✓':state==='cool'?'⏳':state==='cur'?s:'🔒'}<small>${s===5?'Seviye atlama':'Taş '+s}</small></div>${s>1?`<div class="seg ${s<=j.stone?'d':''}"></div>`:''}`;
  }
  const grp=groupOf(L).map(id=>cat(id).n);
  setApp(`<p class="eyebrow">Yolculuk</p><h1>Seviye ${L}</h1>
   <div class="card"><div class="row between"><div><b>Şu anki taş: ${j.stone}${j.stone===5?' (süreli · '+fmtT(stoneTime(L))+')':''}</b><p class="mut sm" style="margin:0">Alanlar: ${grp.map(esc).join(', ')}</p></div>
   <div>${cool?`<span class="tag" id="cd">Bekleme: ${fmtLeft(j.cool-now)}</span>`:`<button class="btn pri" data-a="jstart">Taşa gir</button>`}</div></div>
   <p class="mut sm" style="margin-top:10px">Her taşta 5 soru var ve her biri farklı bir alandan gelir. Tek yanlış denemeyi bitirir. Başarısız olursan aynı taşı ${DB.s.cool/60} saat sonra yeniden denersin; geçtiğin taşlar kaybolmaz.</p></div>
   <div class="card sec"><div class="path" aria-label="Seviye ${L} yolu">${lv}</div><p class="mut sm" style="text-align:center">Seviye ${L-1>0?(L-1)+' seviye tamamlandı':'yolculuğun başlangıcı'}</p></div>`);
  if(cool)every(()=>{const e=$('#cd'),l=u.j.cool-Date.now();if(l<=0)route();else if(e)e.textContent='Bekleme: '+fmtLeft(l)},1000);
};
A.jstart=()=>{
  const u=U();if(!u)return;const j=u.j,L=j.level;
  if(j.cool>Date.now())return toast('Bu taş için bekleme sürüyor.');
  const grp=shuffle(groupOf(L)),qs=[],need=L<=3?1:L<=8?2:3;
  for(const mid of grp){
    const pool=poolFor(mid).filter(q=>!j.seen[q.id]);
    if(!pool.length)return toast('“'+cat(mid).n+'” alanında yeni soru kalmadı. Yönetici soru ekleyince devam edebilirsin.');
    const best=pool.sort((a,b)=>Math.abs(a.d-need)-Math.abs(b.d-need));
    const top=best.filter(q=>Math.abs(q.d-need)===Math.abs(best[0].d-need));
    qs.push(rnd(top));
  }
  j.active=true;save();
  const timed=j.stone===5,stoneNo=j.stone;
  play({qs,title:`Seviye ${L} · Taş ${stoneNo}`,instant:true,failFast:true,limit:timed?stoneTime(L):0,
    onShow:q=>{u.j.seen[q.id]=1;save()},
    onAbort:()=>{if(U()&&U().j.active){journeyFail(U())}},
    onEnd:res=>{
      const pass=res.ok.every(Boolean)&&res.ok.length===5;
      u.j.active=false;
      if(pass){
        bump('stone');
        if(stoneNo===5){u.j.level++;u.j.stone=1}else u.j.stone++;
        act(u,`Yolculuk: Seviye ${L} taş ${stoneNo} geçildi`);checkBadges();save();
        setApp(`<div class="run"><div class="card" style="text-align:center"><p class="eyebrow">Taş geçildi</p><h1>${stoneNo===5?'Seviye '+L+' tamamlandı!':'Harika!'}</h1><p class="mut">${stoneNo===5?'Seviye '+(L+1)+' seni bekliyor.':'Sıradaki taş açıldı.'}</p><a class="btn pri" href="#/yolculuk">Yol haritası</a></div></div>`);
      }else{
        journeyFail(u);
        setApp(`<div class="run"><div class="card" style="text-align:center"><p class="eyebrow">${res.reason==='time'?'Süre doldu':'Deneme bitti'}</p><h1>Bu taşta kaldın</h1><p class="mut">Geçtiğin taşlar durur. Aynı taşı ${DB.s.cool/60} saat sonra yeniden deneyebilirsin; yeni denemede 5 soru da değişir.</p><a class="btn pri" href="#/yolculuk">Yol haritası</a></div></div>`);
      }
    }});
};

V.duello=()=>{
  const u=U();
  setApp(`<p class="eyebrow">1’e 1 düello</p><h1>Rakibini bul</h1>
   <div class="grid g2"><div class="card"><h3>⚔️ Sıralamalı düello</h3><p class="mut">Beceri puanı yakın biriyle 5 tur: Bilim, Genel Kültür, Tarih, Spor, Coğrafya. Her doğru 10 puan. Eşitlikte toplam cevaplama süresi belirler.</p>${u?`<button class="btn pri" data-a="duel" data-m="ranked">Eşleşme ara</button>`:'<a class="btn pri" href="#/giris">Giriş yap</a>'}</div>
   <div class="card"><h3>🤝 Arkadaşla özel düello</h3><p class="mut">Kredi kazandırmaz, beceri puanını değiştirmez. Arkadaşlar sekmesinden davet gönderebilirsin.</p>${u?'<a class="btn out" href="#/profil/arkadaslar">Arkadaşlara git</a>':'<a class="btn out" href="#/giris">Giriş yap</a>'}</div></div>
   <div class="card sec"><h3>Demo uyarısı</h3><p class="mut">Gerçek rakiple eşleşme sunucu bağlantısı gerektirir; bu sürümde eşleşme bir demo rakiple oynanır. Demo maçlar kredi vermez ve beceri puanını değiştirmez.</p></div>`);

A.duel=t=>duelRun(t.dataset.m||'friend');
function duelRun(mode){
  const u=U();if(!u)return go('#/giris');
  const names=['Bilim','Genel Kültür','Tarih','Spor','Coğrafya'];
  const qs=names.map(nm=>{const m=MAINS().find(c=>c.n===nm);return rnd(poolFor(m.id))});
  const D={r:0,me:0,op:0,tm:0,to:0,ans:null,opA:null,phase:'wait',ms:0,start:0,opMs:0};
  const sec=DB.s.duelSec;
  const intro=eqItem(u,'intro');
  setApp(`<div class="card" style="text-align:center;max-width:520px;margin:30px auto"><div class="spinner"></div><h2 style="margin-top:18px">Rakip aranıyor…</h2><p class="mut">Beceri puanın: ${u.skill}</p><button class="btn out" data-a="dquit">Vazgeç</button></div>`);
  CUR={abort(){}, dquit(){go('#/duello')}};
  later(()=>{
    if(!CUR)return;
    setApp(`<div class="card" style="max-width:560px;margin:30px auto"><div class="vs"><div>${avatar(u,64)}<br><b>${nameHtml(u)}</b></div><b class="${intro?intro.d.k:''}" style="font-size:2rem">VS</b><div><span class="av" style="width:64px;height:64px;font-size:30px">🤖</span><br><b>Demo Rakip</b></div></div><p class="mut" style="text-align:center;margin-top:14px">${mode==='ranked'?'Sıralamalı':'Özel'} demo maç · kredi ve puan etkilenmez</p></div>`);
    later(round,1800);
  },1800);
  function round(){
    if(!CUR)return;D.phase='ans';D.ans=null;D.start=Date.now();D.end=D.start+sec*1000;
    const q=qs[D.r],opOk=Math.random()<.6,opDelay=2000+Math.random()*(sec*600);
    D.opA=opOk?q.a:rnd([0,1,2,3].filter(x=>x!==q.a));D.opAt=D.start+opDelay;
    drawQ();
  }
  function drawQ(){
    const q=qs[D.r];
    setApp(`<div class="run"><div class="qhead"><div><b>Tur ${D.r+1} / 5 · ${names[D.r]}</b><br><span class="mut sm">Sen ${D.me} · Rakip ${D.op}</span></div><div class="clock" id="clk" role="timer"></div></div><div class="bar"><i style="width:${D.r/5*100}%"></i></div>
     <div class="card"><h2 class="qt">${esc(q.q)}</h2><div class="opts">${q.o.map((o,k)=>`<button class="opt ${D.ans===k?'sel':''}" data-a="dpick" data-v="${k}" ${D.ans!=null?'disabled':''}><i>${LET[k]}</i>${esc(o)}</button>`).join('')}</div>
     <p class="mut sm" style="margin-top:12px">${D.ans!=null?'Cevabın gönderildi. Rakibi bekliyorsun…':'Rakibin cevabı tur bitene kadar görünmez.'}</p><div class="acts"><button class="btn out sm" data-a="dquit2">Bağlantıyı kopar (demo)</button></div></div></div>`);
    tickD();
  }
  function tickD(){
    const el=$('#clk');if(el){const s=(D.end-Date.now())/1000;el.textContent='⏱ '+fmtT(s);el.classList.toggle('low',s<5)}
    if(D.phase!=='ans')return;
    const opDone=Date.now()>=D.opAt;
    if((D.ans!=null&&opDone)||Date.now()>=D.end)reveal();
  }
  every(tickD,300);
  function reveal(){
    if(D.phase!=='ans')return;D.phase='rev';
    const q=qs[D.r],now=Date.now();
    const myOk=D.ans===q.a,opOk=D.opA===q.a;
    if(myOk)D.me++;if(opOk)D.op++;
    D.tm+=D.ans!=null?D.ms:sec*1000;D.to+=Math.min(D.opAt,D.end)-D.start;
    const last=D.r===4;
    setApp(`<div class="run"><div class="qhead"><b>Tur ${D.r+1} sonucu</b><span class="tag">Skor ${D.me*10} – ${D.op*10}</span></div><div class="card"><h2 class="qt">${esc(q.q)}</h2>
     <div class="opts">${q.o.map((o,k)=>`<div class="opt ${k===q.a?'good':(k===D.ans||k===D.opA?'bad':'')}"><i>${LET[k]}</i><span style="flex:1">${esc(o)}</span><span class="tag">${k===D.ans?'Sen ':''}${k===D.opA?'Rakip':''}</span></div>`).join('')}</div>
     <p style="margin-top:12px">Sen: ${D.ans==null?'Süre doldu':(myOk?'Doğru':'Yanlış')} · Rakip: ${opOk?'Doğru':'Yanlış'}</p><p class="mut">${esc(q.e)}</p>
     <div class="acts"><button class="btn pri grow" data-a="dnext">${last?'Maçı bitir':'Sonraki tur'}</button></div></div></div>`);
  }
  CUR.dpick=k=>{if(D.phase!=='ans'||D.ans!=null)return;D.ans=k;D.ms=Date.now()-D.start;drawQ()};
  CUR.dnext=()=>{if(D.r>=4)finish('done');else{D.r++;round()}};
  CUR.dquit2=()=>finish('drop');
  function finish(why){
    CUR=null;u.duels++;bump('duel');act(u,'Düello oynadı (demo)');checkBadges();save();
    const win=D.me>D.op||(D.me===D.op&&D.tm<D.to),draw=D.me===D.op&&D.tm===D.to;
    setApp(`<div class="run"><div class="card" style="text-align:center"><p class="eyebrow">${why==='drop'?'Bağlantı koptu · maç bitti':'Maç bitti'}</p><h1>${why==='drop'?'Maç yarıda kaldı':(draw?'Berabere':win?'Kazandın!':'Rakip kazandı')}</h1>
     <div class="score">${D.me*10} – ${D.op*10}</div><p class="mut">Toplam süre: ${(D.tm/1000).toFixed(1)} sn – ${(D.to/1000).toFixed(1)} sn</p>
     <p class="tag">Demo maç: kredi ve beceri puanı değişmedi</p><div class="row" style="justify-content:center;margin-top:12px"><a class="btn pri" href="#/duello">Düelloya dön</a></div></div></div>`);
  }
}
A.dquit=()=>CUR&&CUR.dquit&&CUR.dquit();A.dpick=t=>CUR&&CUR.dpick&&CUR.dpick(+t.dataset.v);A.dnext=()=>CUR&&CUR.dnext&&CUR.dnext();A.dquit2=()=>CUR&&CUR.dquit2&&CUR.dquit2();

/* --- sıralamalar --- */
function board(t0,t1,cid){
  const rows=[];
  Object.values(DB.users).forEach(u=>{
    const s=new Set();
    u.log.forEach(l=>{if(l.ok&&l.t>=t0&&(!t1||l.t<=t1)&&(!cid||l.c===cid))s.add(l.q)});
    if(s.size)rows.push({u,p:s.size*10});
  });
  return rows.sort((a,b)=>b.p-a.p);
}
V.siralamalar=(arg)=>{
  const sp=new URLSearchParams(arg||'');const tab=sp.get('t')||'hafta',cid=sp.get('c')||MAINS()[0].id,sid=+sp.get('s')||DB.seasons[DB.seasons.length-1].id;
  const season=DB.seasons.find(s=>s.id===sid)||DB.seasons[DB.seasons.length-1];
  let rows,sub='';
  if(tab==='hafta'){rows=board(weekStart().getTime(),0,null);sub='Bu hafta'}
  else if(tab==='sezon'){rows=board(season.a,season.b,null);sub=season.n+(season.b?' (bitti)':' (sürüyor)')}
  else{rows=board(0,0,cid);sub=cat(cid).n+' · tüm zamanlar'}
  const me=U(),myi=me?rows.findIndex(r=>r.u.name===me.name):-1;
  setApp(`<p class="eyebrow">Sıralamalar</p><h1>Liderlik tabloları</h1>
   <div class="tabs"><a href="#/siralamalar?t=hafta" class="${tab==='hafta'?'on':''}">Haftalık</a><a href="#/siralamalar?t=sezon" class="${tab==='sezon'?'on':''}">Sezonluk</a><a href="#/siralamalar?t=kat" class="${tab==='kat'?'on':''}">Kategori</a></div>
   ${tab==='kat'?`<select id="ksel" aria-label="Kategori" style="max-width:340px">${MAINS().map(m=>`<option value="${m.id}" ${m.id===cid?'selected':''}>${esc(m.n)}</option>`).join('')}</select>`:''}
   ${tab==='sezon'?`<select id="ssel" aria-label="Sezon" style="max-width:340px">${DB.seasons.map(s=>`<option value="${s.id}" ${s.id===season.id?'selected':''}>${esc(s.n)}${s.b?'':' (güncel)'}</option>`).join('')}</select>`:''}
   <p class="mut" style="margin-top:12px">${esc(sub)} · Aynı soruyu tekrar çözmek puanı artırmaz.</p>
   ${me?(myi>=0?`<div class="card" style="margin-bottom:14px"><b>Senin yerin: ${myi+1}. sıra</b> · ${rows[myi].p} puan</div>`:'<div class="card" style="margin-bottom:14px">Bu listede henüz puanın yok. Bir quiz çöz ve sıraya gir.</div>'):'<div class="card" style="margin-bottom:14px">Sıralamaya girmek için <a href="#/giris">giriş yap</a>.</div>'}
   <div class="card tw">${rows.length?`<table><tr><th>Sıra</th><th>Oyuncu</th><th>Puan</th></tr>${rows.slice(0,50).map((r,i)=>`<tr ${me&&r.u.name===me.name?'style="background:var(--soft)"':''}><td>${i+1}</td><td><a href="#/u/${encodeURIComponent(r.u.name)}" class="row" style="text-decoration:none;color:var(--txt)">${avatar(r.u,32)} ${nameHtml(r.u)}</a></td><td>${r.p}</td></tr>`).join('')}</table>`:'<div class="empty">Bu dönemde henüz sıralamaya giren oyuncu yok.</div>'}</div>`);
  const k=$('#ksel');if(k)k.onchange=()=>go('#/siralamalar?t=kat&c='+k.value);
  const s=$('#ssel');if(s)s.onchange=()=>go('#/siralamalar?t=sezon&s='+s.value);
};

V.gorevler=()=>{
  const u=U();
  if(!u)return setApp(`<div class="form card" style="text-align:center"><p class="eyebrow">Görevler</p><h1>Görevler hesapla takip edilir</h1><p class="mut">Günlük ve haftalık görevler, seri ve rozetler için giriş yap.</p><a class="btn pri" href="#/giris">Giriş yap</a></div>`);
  const row=m=>{
    const pk=(m.per==='d'?'d'+dayKey():'w'+weekKey()),v=Math.min(m.target,u.m[pk+':'+m.metric]||0),done=v>=m.target,ck=m.id+':'+pk,cl=u.claimed[ck];
    return `<div class="card"><div class="row between"><div><b>${esc(m.t)}</b><br><span class="mut sm">${v} / ${m.target}${m.reward>0?' · Ödül: 🪙 '+m.reward:''}</span></div>${cl?'<span class="tag ok">Alındı</span>':done?`<button class="btn mint sm" data-a="claim" data-m="${m.id}">Tamamla${m.reward>0?' +'+m.reward:''}</button>`:''}</div><div class="meter" style="margin-top:10px"><i style="width:${v/m.target*100}%"></i></div></div>`};
  setApp(`<p class="eyebrow">Görevler</p><h1>Görevler</h1>
   <div class="grid g3"><div class="card"><span class="mut sm">Katılım serisi</span><h2>🔥 ${u.streak} gün</h2><span class="mut sm">Bir gün kaçırırsan yalnızca seri sıfırlanır; gelişimin kalır.</span></div><div class="card"><span class="mut sm">Rozetler</span><h2>🏅 ${u.badges.length} / ${BADGES.length}</h2><a href="#/profil/basarilar">Rozetlerim</a></div></div>
   ${section('Günlük görevler','<div class="grid g2">'+DB.missions.filter(m=>m.per==='d').map(row).join('')+'</div>')}
   ${section('Haftalık görevler','<div class="grid g2">'+DB.missions.filter(m=>m.per==='w').map(row).join('')+'</div>')}`);
};
A.claim=t=>{
  const u=U(),m=DB.missions.find(x=>x.id===t.dataset.m);if(!u||!m)return;
  const pk=m.per==='d'?'d'+dayKey():'w'+weekKey(),ck=m.id+':'+pk;
  if(u.claimed[ck]||(u.m[pk+':'+m.metric]||0)<m.target)return;
  u.claimed[ck]=1;if(m.reward>0)u.credits+=m.reward;save();chrome();toast(m.reward>0?'🪙 +'+m.reward+' kredi':'Görev tamamlandı');route();
};

A.buy=t=>{
  const u=U();if(!u){go('#/giris');return}
  const i=item(t.dataset.id);if(!i||i.price==null)return;
  if(u.owned.includes(i.id))return toast('Bu ürüne zaten sahipsin.');
  if(u.credits<i.price)return toast('Yeterli kredin yok. '+(i.price-u.credits)+' kredi daha gerekli.');
  confirmBox('Satın alma onayı',`<b>${esc(i.n)}</b> ürünü <b>${i.price} kredi</b> karşılığında alınacak. Bu ürün oyun avantajı vermez.`,'Satın al',()=>{
    if(u.owned.includes(i.id)||u.credits<i.price)return;
    u.credits-=i.price;u.owned.push(i.id);act(u,i.n+' satın aldı');checkBadges();save();chrome();toast('Koleksiyonuna eklendi.');route();
  });
};
A.use=t=>{const u=U(),i=item(t.dataset.id);if(!u||!i||!u.owned.includes(i.id))return;u.eq[i.type]=i.id;save();chrome();route()};
A.unuse=t=>{const u=U();if(!u)return;delete u.eq[t.dataset.t];save();chrome();route()};

V.kayit=()=>{

  }else if(tab==='sorular'){
    b=`<div class="card"><h3>Soru ekle (ortak havuza)</h3><label for="qt">Soru</label><textarea id="qt" rows="2"></textarea><label for="qc">Kategori</label>${sel('qc','')}<div class="grid g2">${[0,1,2,3].map(k=>`<div><label for="qo${k}">Şık ${LET[k]}</label><input id="qo${k}" value="Cevap"></div>`).join('')}</div><label for="qa">Doğru şık</label><select id="qa">${[0,1,2,3].map(k=>`<option value="${k}">${LET[k]}</option>`).join('')}</select><label for="qe">Açıklama</label><input id="qe" value="Açıklama"><label for="qd">Zorluk</label><select id="qd"><option value="1">Kolay</option><option value="2">Orta</option><option value="3">Zor</option></select><div style="margin-top:12px"><button class="btn pri" data-a="aqadd">Yayımla</button></div></div>
     <div class="card sec"><h3>Havuza eklenen sorular (${DB.extra.length})</h3>${DB.extra.length?DB.extra.map(x=>`<div class="row between rev"><span>${esc(x.q)} <span class="tag">${esc(cat(x.cat)?cat(x.cat).n:'')}</span></span><button class="btn sm out" data-a="aqdel" data-id="${x.id}">Sil</button></div>`).join(''):'<span class="mut">Henüz soru eklenmedi. Havuz şu an “Soru / Cevap” yer tutucularıyla çalışır.</span>'}</div>`;
  }else if(tab==='oneriler'){
    const l=DB.sugs.filter(s=>s.st==='bekliyor');
    b=l.length?l.map(s=>`<div class="card" style="margin-bottom:12px"><b>${esc(s.text)}</b><br><span class="mut sm">${esc(s.by)} · ${esc(cat(s.cat)?cat(s.cat).n:'')} · ${fmtD(s.at)}</span><div class="grid g2" style="margin-top:10px">${[0,1,2,3].map(k=>`<input id="so${s.id}-${k}" value="Cevap" aria-label="Şık ${LET[k]}">`).join('')}</div><div class="row" style="margin-top:10px"><select id="sa${s.id}" style="width:auto">${[0,1,2,3].map(k=>`<option value="${k}">Doğru: ${LET[k]}</option>`).join('')}</select><select id="sd${s.id}" style="width:auto"><option value="1">Kolay</option><option value="2" selected>Orta</option><option value="3">Zor</option></select><button class="btn sm mint" data-a="sugok" data-id="${s.id}">Onayla ve yayımla</button><button class="btn sm out" data-a="sugno" data-id="${s.id}">Reddet</button></div></div>`).join(''):'<div class="card empty">İncelenecek öneri yok. Onaylanmayan öneriler testlerde görünmez.</div>';
  }else if(tab==='raporlar'){
    const l=DB.reports.filter(r=>r.open);
    b=l.length?`<div class="card">${l.map(r=>`<div class="row between rev"><span><b>${esc(r.q)}</b> · ${esc(r.note)||'(not yok)'}<br><span class="mut sm">${esc(r.by)} · ${fmtD(r.at)}</span></span><button class="btn sm out" data-a="rpclose" data-id="${r.id}">İncelendi</button></div>`).join('')}</div>`:'<div class="card empty">Açık bildirim yok.</div>';
  }else if(tab==='quizler'){
    b=`<div class="card"><h3>Yeni sabit quiz</h3><label for="nq">Başlık</label><input id="nq"><label for="nc">Kategori</label>${sel('nc','')}<label for="nn">Soru sayısı</label><input id="nn" type="number" min="1" max="50" value="10"><div style="margin-top:12px"><button class="btn pri" data-a="aqz">Oluştur</button></div></div>
     <div class="card sec tw"><table><tr><th>Quiz</th><th>Sürüm</th><th>Öne çıkan</th><th>Durum</th><th></th></tr>${DB.quizzes.map(q=>`<tr><td><input value="${esc(q.t)}" data-a="" onchange="A.qztitle('${q.id}',this.value)" aria-label="Başlık" style="min-width:200px"></td><td>${q.ver}</td><td><input type="checkbox" style="width:auto;min-height:0" ${q.feat?'checked':''} onchange="A.qzfeat('${q.id}',this.checked)" aria-label="Öne çıkan"></td><td>${q.st}</td><td class="row"><button class="btn sm out" data-a="qzver" data-id="${q.id}">Yeni sürüm</button><button class="btn sm out" data-a="qzst" data-id="${q.id}">${q.st==='taslak'?'Yayımla':'Taslağa al'}</button></td></tr>`).join('')}</table></div>`;
  }else if(tab==='yolculuk'){
    const g=DB.s.groups;
    b=`<div class="card"><h3>Alan grupları (her grup 5 seviye)</h3>${g.map((gr,gi)=>`<p><b>Seviye ${gi*5+1}–${gi*5+5}</b></p><div class="grid g3">${gr.map((id,k)=>`<select data-a="" onchange="A.setgrp(${gi},${k},this.value)" aria-label="Alan">${MAINS().map(m=>`<option value="${m.id}" ${m.id===id?'selected':''}>${esc(m.n)}</option>`).join('')}</select>`).join('')}</div>`).join('')}<p class="mut sm">Beş alan aynı grupta tekrar edemez; kaydedilirken kontrol edilir. Grup sayısı kadar seviye bloğundan sonra gruplar başa döner.</p></div>
     <div class="card sec"><h3>Seviye atlama taşı süreleri (saniye)</h3><div class="row"><label>Başlangıç <input id="sb" type="number" value="${DB.s.stoneBase}" min="10"></label><label>Seviye başı azalma <input id="ss" type="number" value="${DB.s.stoneStep}" min="0"></label><label>Bekleme (dk) <input id="sc" type="number" value="${DB.s.cool}" min="1"></label></div>
     <div class="grid g3" style="margin-top:10px">${Array.from({length:15},(_,i)=>`<label>Seviye ${i+1}<input type="number" min="0" placeholder="${stoneTime(i+1)}" value="${DB.s.stoneTimes[i+1]||''}" onchange="A.stt(${i+1},this.value)"></label>`).join('')}</div><p class="mut sm">Boş bırakılan seviye formülü kullanır.</p><button class="btn pri" data-a="svj">Kaydet</button></div>`;
  }else if(tab==='duello'){
    b=`<div class="card"><h3>Düello ayarları</h3><div class="grid g3"><label>Tur süresi (sn)<input id="d1" type="number" min="5" value="${DB.s.duelSec}"></label><label>Doğru başına kredi<input id="d2" type="number" min="0" value="${DB.s.duelCredit}"></label><label>Galibiyet bonusu<input id="d3" type="number" min="0" value="${DB.s.duelBonus}"></label></div><p class="mut sm">Kredi değerleri gerçek eşleşme altyapısı bağlandığında kullanılır; demo maçlar kredi vermez.</p><button class="btn pri" data-a="svd" style="margin-top:12px">Kaydet</button></div>`;
  }else if(tab==='magaza'){
    b=`<div class="card tw"><h3>Ürünler ve fiyatlar</h3><p class="mut sm">Fiyat boş bırakılan ürün satın alınamaz.</p><table><tr><th>Ürün</th><th>Tür</th><th>Fiyat (kredi)</th><th>Aktif</th></tr>${DB.store.map(i=>`<tr><td>${esc(i.n)}</td><td>${esc(STORE_TYPES.find(t=>t[0]===i.type)[1])}</td><td><input type="number" min="0" value="${i.price==null?'':i.price}" onchange="A.price('${i.id}',this.value)" aria-label="Fiyat" style="width:110px"></td><td><input type="checkbox" style="width:auto;min-height:0" ${i.on?'checked':''} onchange="A.sact('${i.id}',this.checked)" aria-label="Aktif"></td></tr>`).join('')}</table></div>`;
  }else if(tab==='gorevler'){
    b=`<div class="card tw"><h3>Görevler</h3><table><tr><th>Görev</th><th>Dönem</th><th>Hedef</th><th>Ödül (kredi)</th></tr>${DB.missions.map(m=>`<tr><td>${esc(m.t)}</td><td>${m.per==='d'?'Günlük':'Haftalık'}</td><td><input type="number" min="1" value="${m.target}" onchange="A.mset('${m.id}','target',this.value)" style="width:90px"></td><td><input type="number" min="0" value="${m.reward==null?'':m.reward}" onchange="A.mset('${m.id}','reward',this.value)" style="width:90px" aria-label="Ödül"></td></tr>`).join('')}</table></div>
     <div class="card sec"><h3>Sezonlar</h3>${DB.seasons.map(s=>`<p>${esc(s.n)} · ${fmtD(s.a)} – ${s.b?fmtD(s.b):'sürüyor'}</p>`).join('')}<button class="btn pri" data-a="newseason">Yeni sezon başlat</button></div>`;
  }else if(tab==='istatistik'){
    const us=Object.values(DB.users),tot=us.reduce((s,x)=>s+x.log.length,0);
    b=`<div class="grid g3"><div class="card"><span class="mut sm">Kullanıcı</span><h2>${us.length}</h2></div><div class="card"><span class="mut sm">Çözülen soru</span><h2>${tot}</h2></div><div class="card"><span class="mut sm">Quiz çözümü</span><h2>${DB.quizzes.reduce((s,q)=>s+q.plays,0)}</h2></div><div class="card"><span class="mut sm">Bekleyen öneri</span><h2>${DB.sugs.filter(s=>s.st==='bekliyor').length}</h2></div><div class="card"><span class="mut sm">Açık bildirim</span><h2>${DB.reports.filter(r=>r.open).length}</h2></div></div>
     <div class="card sec tw"><h3>Kategori başına doğruluk</h3><table><tr><th>Kategori</th><th>Cevap</th><th>Doğruluk</th></tr>${MAINS().map(m=>{const a=us.reduce((s,x)=>s+(x.cat[m.id]?x.cat[m.id].a:0),0),c=us.reduce((s,x)=>s+(x.cat[m.id]?x.cat[m.id].c:0),0);return `<tr><td>${esc(m.n)}</td><td>${a}</td><td>${a?'%'+Math.round(c/a*100):'-'}</td></tr>`}).join('')}</table></div>`;
  }
  setApp(`<p class="eyebrow">Yönetim</p><h1>Yönetim paneli</h1><div class="tabs">${AT.map(t=>`<a href="#/yonetim/${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</a>`).join('')}</div>${b}`);
};
const adm=()=>{const u=U();return u&&u.admin};
A.acadd=()=>{if(!adm())return;const n=$('#cn').value.trim(),p=$('#cp').value||null;if(!n)return toast('Ad yaz.');const par=p?cat(p):null;const main=p?mainOf(p):null;DB.cats.push({id:'c'+Date.now(),n,i:main?main.i:'📌',c:main?main.c:'#5C50F1',p});save();toast('Eklendi.');route()};
A.acrename=t=>{if(!adm())return;const c=cat(t.dataset.id);modal(`<h3>Adı değiştir</h3><input id="rn" value="${esc(c.n)}"><div class="row" style="margin-top:12px"><button class="btn pri" id="rok">Kaydet</button><button class="btn out" data-a="close">Vazgeç</button></div>`);$('#rok').onclick=()=>{const v=$('#rn').value.trim();if(v){c.n=v;save();closeModal();route()}}};
A.acdel=t=>{if(!adm())return;const id=t.dataset.id,ids=desc(id);if(DB.quizzes.some(q=>ids.includes(q.cat)))return toast('İçinde quiz olan kategori silinemez.');if(DB.extra.some(q=>ids.includes(q.cat)))return toast('İçinde soru olan kategori silinemez.');
  if(!cat(id).p&&MAINS().length<=5)return toast('En az 5 ana kategori kalmalı.');
  confirmBox('Kategoriyi sil',esc(cat(id).n)+' ve alt başlıkları silinecek.','Sil',()=>{DB.cats=DB.cats.filter(c=>!ids.includes(c.id));DB.s.groups=DB.s.groups.map(g=>g.map(x=>ids.includes(x)?MAINS()[0].id:x));save();route()})};
A.aqadd=()=>{if(!adm())return;const q=$('#qt').value.trim();if(!q)return toast('Soru metni yaz.');DB.extra.push({id:'x'+Date.now(),q,o:[0,1,2,3].map(k=>$('#qo'+k).value.trim()||'Cevap'),a:+$('#qa').value,e:$('#qe').value.trim(),d:+$('#qd').value,cat:$('#qc').value,st:'yayin'});save();toast('Havuza eklendi.');route()};
A.aqdel=t=>{if(!adm())return;DB.extra=DB.extra.filter(x=>x.id!==t.dataset.id);save();route()};
A.sugok=t=>{if(!adm())return;const id=+t.dataset.id,s=DB.sugs.find(x=>x.id===id);if(!s)return;DB.extra.push({id:'x'+id,q:s.text,o:[0,1,2,3].map(k=>$(`#so${id}-${k}`).value.trim()||'Cevap'),a:+$('#sa'+id).value,e:'Açıklama',d:+$('#sd'+id).value,cat:s.cat,st:'yayin'});s.st='yayinda';save();toast('Yayımlandı.');route()};
A.sugno=t=>{if(!adm())return;const s=DB.sugs.find(x=>x.id===+t.dataset.id);if(s)s.st='reddedildi';save();route()};
A.rpclose=t=>{if(!adm())return;const r=DB.reports.find(x=>x.id===+t.dataset.id);if(r)r.open=false;save();route()};
A.qztitle=(id,v)=>{if(!adm())return;const q=quiz(id);if(q&&v.trim()){q.t=v.trim();save()}};
A.qzfeat=(id,v)=>{if(!adm())return;quiz(id).feat=v;save()};
A.qzver=t=>{if(!adm())return;const q=quiz(t.dataset.id);q.ver++;save();toast('Yeni sürüm: '+q.ver+'. Eski sonuçlar eski sürümle saklanır.');route()};
A.qzst=t=>{if(!adm())return;const q=quiz(t.dataset.id);q.st=q.st==='taslak'?'yayin':'taslak';save();route()};
A.aqz=()=>{if(!adm())return;const t=$('#nq').value.trim(),c=$('#nc').value,n=Math.max(1,Math.min(50,+$('#nn').value||10));if(!t)return toast('Başlık yaz.');const id='q'+Date.now(),m=mainOf(c);
  DB.quizzes.push({id,t,cat:c,ver:1,feat:false,plays:0,at:DB.quizzes.length,st:'yayin',qs:Array.from({length:n},(_,j)=>({id:id+'-'+(j+1),q:'Soru '+(j+1),o:['Cevap A','Cevap B','Cevap C','Cevap D'],a:j%4,e:'Açıklama',d:1+j%3,cat:m.id,sub:c}))});save();toast('Quiz oluşturuldu.');route()};
A.setgrp=(gi,k,v)=>{if(!adm())return;DB.s.groups[gi][k]=v};
A.stt=(L,v)=>{if(!adm())return;if(+v>0)DB.s.stoneTimes[L]=+v;else delete DB.s.stoneTimes[L];save()};
A.svj=()=>{if(!adm())return;for(const g of DB.s.groups){if(new Set(g).size!==g.length)return toast('Bir grupta aynı alan iki kez seçilemez.')}DB.s.stoneBase=+$('#sb').value||90;DB.s.stoneStep=+$('#ss').value||0;DB.s.cool=+$('#sc').value||120;save();toast('Kaydedildi.')};
A.svd=()=>{if(!adm())return;DB.s.duelSec=+$('#d1').value||20;DB.s.duelCredit=+$('#d2').value||0;DB.s.duelBonus=+$('#d3').value||0;save();toast('Kaydedildi.')};
A.price=(id,v)=>{if(!adm())return;item(id).price=v===''?null:Math.max(0,Math.round(+v));save()};
A.sact=(id,v)=>{if(!adm())return;item(id).on=v;save()};
A.mset=(id,k,v)=>{if(!adm())return;const m=DB.missions.find(x=>x.id===id);m[k]=v===''?null:Math.max(0,+v);save()};
A.newseason=()=>{if(!adm())return;confirmBox('Yeni sezon','Mevcut sezon kapanır ve sıralamada geçmiş sezon olarak kalır.','Başlat',()=>{const s=DB.seasons[DB.seasons.length-1];s.b=Date.now();DB.seasons.push({id:s.id+1,n:'Sezon '+(s.id+1),a:Date.now(),b:null});save();route()})};

V.nf=()=>setApp(`<div class="card empty"><h2>Sayfa bulunamadı</h2><a class="btn pri" href="#/">Ana sayfaya dön</a></div>`);

/* ================= yönlendirici ================= */
function route(){
  if(CUR&&CUR.abort){try{CUR.abort()}catch(e){}}CUR=null;
  TIMERS.forEach(t=>{clearInterval(t);clearTimeout(t)});TIMERS=[];
  closeModal();
  let h=(location.hash||'#/').slice(1);let arg='';
  const qi=h.indexOf('?');if(qi>=0){arg=h.slice(qi+1);h=h.slice(0,qi)}
  const p=h.split('/').filter(Boolean),r=p[0]||'home',a=p[1];
  const map={home:()=>V.home(),kesfet:()=>V.kesfet(),kategori:()=>V.kategori(a),quiz:()=>V.quiz(a),oyna:()=>V.oyna(a),modlar:()=>V.modlar(),sonsuz:()=>V.sonsuz(a),sinav:()=>V.sinav(a),yolculuk:()=>V.yolculuk(),duello:()=>V.duello(),siralamalar:()=>V.siralamalar(arg),gorevler:()=>V.gorevler(),magaza:()=>V.magaza(arg),giris:()=>V.giris(),kayit:()=>V.kayit(),seviye:()=>V.seviye(),profil:()=>V.profil(a),u:()=>V.u(a),oner:()=>V.oner(),yonetim:()=>V.yonetim(a)};
  chrome();
  (map[r]||V.nf)();
  app.focus({preventScroll:true});
}
window.addEventListener('hashchange',route);
window.addEventListener('resize',()=>{const tl=$('#tlogin');if(tl)tl.style.display=innerWidth>=900?'inline-flex':'none'});
load();applyTheme();
if(DB.me&&!DB.users[DB.me])DB.me=null;
route();
</script>
</body>
</html>
