<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Collon</title>
<meta name="description" content="Collon: Çöz, öğren, yarış.">
<link rel="canonical" href="https://collon.vercel.app/">
<meta property="og:type" content="website">
<meta property="og:title" content="Collon">
<meta property="og:description" content="Collon: Çöz, öğren, yarış.">
<meta property="og:url" content="https://collon.vercel.app/">
<link rel="icon" href="assets/collon-mark.svg" type="image/svg+xml">
<style>
:root{--pu:#5C50F1;--pu2:#4A3FE0;--sun:#FFB548;--mint:#36CFA8;--ink:#19172F;--bg:#F6F6FE;--card:#FFFFFF;--soft:#EEECFF;--txt:#19172F;--mut:#5E5B7A;--line:#E3E1F7;--red:#D93A40;--lnk:#4A3FE0;--sh:0 10px 30px rgba(92,80,241,.12);--r:26px;--blob:#E6E3FF;--cbg:#fff;--cbd:transparent;color-scheme:light;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060616;--card:#0F1030;--soft:#1A1C48;--txt:#EEF0FF;--mut:#A9AEDC;--line:#2A2F6E;--lnk:#93A3FF;--sh:0 14px 36px rgba(0,0,0,.45);--blob:#141C6B;--cbg:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.025));--cbd:rgba(130,150,255,.24);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#060616;--card:#0F1030;--soft:#1A1C48;--txt:#EEF0FF;--mut:#A9AEDC;--line:#2A2F6E;--lnk:#93A3FF;--sh:0 14px 36px rgba(0,0,0,.45);--blob:#141C6B;--cbg:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.025));--cbd:rgba(130,150,255,.24);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:16px/1.5 "Segoe UI",Inter,system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;right:-160px;top:-180px;width:460px;height:460px;border-radius:50%;background:var(--blob);z-index:-1}
h1,h2,h3{font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 .4em}
h1{font-size:clamp(2rem,6vw,3.2rem)}h2{font-size:1.45rem}h3{font-size:1.1rem}
a{color:var(--lnk)}
p{margin:0 0 .8em}
.mut{color:var(--mut)}.sm{font-size:.88rem}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--lnk);margin:0 0 .6em}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
main{padding:30px 0 24px;min-height:70vh}
/* üst çubuk */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--txt);font-weight:800;font-size:1.35rem;letter-spacing:-.03em}
.brand svg{width:38px;height:38px}
.dnav{display:none;gap:2px;margin-left:12px;flex:1}
.dnav a{padding:9px 13px;border-radius:12px;color:var(--mut);text-decoration:none;font-weight:700;font-size:.95rem}
.dnav a:hover{background:var(--soft)}.dnav a.on{background:var(--soft);color:var(--lnk)}
.tright{margin-left:auto;display:flex;align-items:center;gap:8px}
.ibtn{width:44px;height:44px;border-radius:14px;border:0;background:var(--soft);color:var(--txt);font-size:1.15rem;cursor:pointer;display:grid;place-items:center;text-decoration:none}
.chipc{display:inline-flex;align-items:center;gap:6px;background:var(--soft);padding:8px 12px;border-radius:999px;font-weight:800;font-size:.92rem;text-decoration:none;color:var(--txt)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;text-decoration:none;color:var(--mut);font-size:.72rem;font-weight:700;min-height:52px;justify-content:center}
.bnav a b{font-size:1.3rem;line-height:1}
.bnav a.on{color:var(--lnk);background:var(--soft)}
@media(min-width:900px){.dnav{display:flex}.bnav{display:none}.mob-only{display:none!important}}
/* bileşenler */
.card{background:var(--cbg);border-radius:var(--r);box-shadow:var(--sh);padding:22px;border:1px solid var(--cbd)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.sec{margin-top:34px}
.sec>.row{margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:2px solid transparent;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;background:var(--soft);color:var(--txt)}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--pu);color:#fff;box-shadow:0 8px 18px rgba(92,80,241,.3)}
.btn.sun{background:var(--sun);color:var(--ink)}
.btn.mint{background:var(--mint);color:var(--ink)}
.btn.out{background:transparent;border-color:var(--line)}
.btn.sm{min-height:38px;padding:0 14px;font-size:.88rem;border-radius:11px}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
.sech{font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--lnk);margin:0}
.hero{padding:26px 0 8px}
.herogrid{display:grid;gap:22px;align-items:center}
@media(min-width:900px){.herogrid{grid-template-columns:1.2fr 1fr}}
.brandcards{display:grid;gap:14px}
.bw{display:flex;align-items:center;gap:18px;min-height:150px}
.wm{font-size:clamp(2.2rem,7vw,3rem);font-weight:800;letter-spacing:-.05em;line-height:1}
.tg{color:var(--mut);margin-top:8px}
.bd{background:#19172F;display:grid;place-items:center;min-height:160px}
@media(max-width:699px){.bd{display:none}}
.foot{padding-top:6px;padding-bottom:110px;color:var(--mut);font-size:.92rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(min-width:900px){.foot{padding-bottom:40px}}
.lead{font-size:1.15rem;color:var(--mut);max-width:34em}
.search{display:flex;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:8px;box-shadow:var(--sh);margin-top:18px;max-width:720px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:1.1rem;padding:0 12px;color:var(--txt);min-height:52px}
.search input:focus{outline:none}.search:focus-within{border-color:var(--pu)}
.qc{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r);background:var(--cbg);border:1px solid var(--cbd);box-shadow:var(--sh);text-decoration:none;color:var(--txt)}
.qc:hover,.catc:hover{box-shadow:0 0 0 2px var(--pu),var(--sh)}
.qrow{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:18px;padding:12px}
.qmark{flex:none;width:42px;height:42px;border-radius:50%;background:var(--pu);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.15rem}
.qbtn{width:100%;pointer-events:none}
.ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;background:color-mix(in srgb,var(--c,#5C50F1) 18%,var(--card))}
.category-art{display:grid;place-items:center;flex:none;overflow:visible;color:var(--lnk);background:none;box-shadow:none}
.category-art .topic-mark,.category-art .official-mark{display:block;width:100%;height:100%;color:inherit;transition:transform .2s ease}
.category-art .official-mark{background:currentColor;-webkit-mask:var(--mark-url) center / contain no-repeat;mask:var(--mark-url) center / contain no-repeat}
.catc:hover .category-art .topic-mark,.catc:hover .category-art .official-mark,.kxsub:hover .category-art .topic-mark,.kxsub:hover .category-art .official-mark,.kxsub:focus-visible .category-art .topic-mark,.kxsub:focus-visible .category-art .official-mark{transform:scale(1.06)}
@media(prefers-reduced-motion:reduce){.category-art .topic-mark,.category-art .official-mark{transition:none}}
.catc{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);background:var(--cbg);border:1px solid var(--cbd);box-shadow:var(--sh);text-decoration:none;color:var(--txt);font-weight:800;min-height:72px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--soft);font-size:.78rem;font-weight:700;color:var(--mut)}
.tag.ok{background:color-mix(in srgb,var(--mint) 30%,var(--card));color:var(--txt)}
.pill{display:inline-flex;align-items:center;padding:9px 14px;border-radius:999px;background:var(--soft);text-decoration:none;color:var(--txt);font-weight:700;font-size:.92rem}
.pill:hover{background:var(--pu);color:#fff}
.mode{display:flex;flex-direction:column;gap:8px;padding:20px;border-radius:var(--r);text-decoration:none;color:var(--ink);min-height:150px}
.mode b{font-size:1.25rem;letter-spacing:-.02em}.mode span{font-size:.92rem;opacity:.85}.mode .e{font-size:2rem}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:14px 0 18px;scrollbar-width:thin}
.tabs a,.tabs button{flex:none;padding:10px 16px;border-radius:12px;background:var(--soft);color:var(--mut);text-decoration:none;font-weight:800;font-size:.92rem;border:0;font-family:inherit;cursor:pointer;min-height:44px}
.tabs .on{background:var(--pu);color:#fff}
input,select,textarea{font:inherit;color:var(--txt);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:11px 13px;min-height:46px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pu)}
label{display:block;font-weight:700;margin:12px 0 6px;font-size:.92rem}
.form{max-width:440px;margin:20px auto}
.err{color:var(--red);font-weight:700;min-height:1.4em}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:.92rem}
.tw{overflow-x:auto}
.empty{text-align:center;padding:34px 16px;color:var(--mut)}
/* quiz oynatıcı */
.run{max-width:760px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pu),var(--mint));border-radius:99px;transition:width .3s}
.clock{font-weight:800;font-size:1.1rem;background:var(--sun);color:var(--ink);padding:6px 14px;border-radius:999px;font-variant-numeric:tabular-nums}
.clock.low{background:var(--red);color:#fff}
.qt{font-size:clamp(1.3rem,4.5vw,1.8rem);margin:6px 0 20px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:60px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
.opt:hover{border-color:var(--pu)}
.opt i{flex:none;width:34px;height:34px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-style:normal;font-weight:800;color:var(--lnk)}
.opt.sel{border-color:var(--pu);background:var(--soft)}
.opt.sel i{background:var(--pu);color:#fff}
.opt.good{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 22%,var(--card))}
.opt.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 14%,var(--card))}
.opt[disabled]{cursor:default}
.acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.acts .grow{flex:1}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px}
.dots button{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--txt);font-weight:800;cursor:pointer}
.dots .done{background:var(--soft);border-color:var(--pu)}.dots .cur{background:var(--pu);color:#fff;border-color:var(--pu)}
.fb{margin-top:14px;padding:14px;border-radius:14px;background:var(--soft)}
.rev{padding:14px 0;border-bottom:1px solid var(--line)}
.score{font-size:3rem;font-weight:800;letter-spacing:-.04em}
.pop{position:fixed;left:50%;top:40%;font-size:4rem;pointer-events:none;animation:pop 1s ease-out forwards;z-index:60}
@keyframes pop{0%{transform:translate(-50%,0) scale(.5);opacity:0}30%{opacity:1;transform:translate(-50%,-20px) scale(1.2)}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
/* yolculuk */
.path{display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 0}
.stone{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.3rem;background:var(--soft);color:var(--mut);border:4px solid var(--line);position:relative;text-align:center;line-height:1.1}
.stone small{display:block;font-size:.66rem;font-weight:700}
.stone.done{background:var(--mint);color:var(--ink);border-color:var(--mint)}
.stone.cur{background:var(--pu);color:#fff;border-color:var(--sun);box-shadow:0 0 0 6px color-mix(in srgb,var(--sun) 35%,transparent)}
.stone.cool{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.stone.final{border-radius:26px}
.seg{width:6px;height:26px;background:var(--line);border-radius:3px}
.seg.d{background:var(--mint)}
.lv{display:flex;flex-direction:column;align-items:center}
/* mağaza / önizleme */
.pv{height:110px;border-radius:16px;display:grid;place-items:center;font-size:2.4rem;overflow:hidden;position:relative}
.av{display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--pu),var(--mint));color:#fff;flex:none}
.modal{position:fixed;inset:0;background:rgba(10,8,30,.55);z-index:50;display:grid;place-items:center;padding:18px}
.modal .card{max-width:440px;width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:70;max-width:90vw;box-shadow:var(--sh)}
.meter{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}.meter i{display:block;height:100%;background:var(--pu);border-radius:99px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.zoom{animation:zoomin .7s ease-out}.slide{animation:slidein .7s ease-out}.spin{animation:spin .8s ease-out}
@keyframes zoomin{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes slidein{from{transform:translateX(-80px);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{from{transform:rotate(-200deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.spinner{width:46px;height:46px;border-radius:50%;border:5px solid var(--soft);border-top-color:var(--pu);animation:rot 1s linear infinite;margin:0 auto}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* ===== giriş (hero) ===== */
#hero:empty{display:none}
#hero{margin-top:-65px}
.hero2{position:relative;overflow:hidden;background:#0C0A1D;color:#fff;padding:132px 0 0;isolation:isolate;border-radius:0 0 44px 44px;--ink:#fff}
.hgrid{position:absolute;inset:-80px 0 0;z-index:-2;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:76px 76px;-webkit-mask-image:radial-gradient(ellipse 75% 70% at 50% 35%,#000 15%,transparent 78%);mask-image:radial-gradient(ellipse 75% 70% at 50% 35%,#000 15%,transparent 78%);animation:gridmove 14s linear infinite}
@keyframes gridmove{to{background-position:0 76px,76px 0}}
.hglow{position:absolute;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.55;animation:glow 8s ease-in-out infinite}
.hglow.g1{width:520px;height:520px;left:-120px;top:120px;background:#5C50F1}
.hglow.g2{width:440px;height:440px;right:-100px;top:60px;background:#1FB894;animation-delay:-4s}
@keyframes glow{50%{transform:scale(1.15);opacity:.4}}
.hc{text-align:center;position:relative;z-index:3}
.hpill{display:inline-flex;align-items:center;gap:8px;font-size:.92rem;margin:0 0 18px;animation:up .7s both}
.hpill .hi{color:#FFD25E;display:grid}.hpill b{color:#FFD25E}.hpill .hm{color:rgba(255,255,255,.7)}
.hh{font-size:clamp(3rem,10.5vw,6.6rem);font-weight:800;letter-spacing:-.045em;line-height:1.0;margin:0 0 20px;color:#fff}
.hh span{display:block;animation:up .8s cubic-bezier(.2,.9,.3,1) both}
.hh span:nth-child(2){animation-delay:.12s;background:linear-gradient(90deg,#fff 30%,#B9B2FF);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes up{from{opacity:0;transform:translateY(34px)}}
.hsub{color:rgba(255,255,255,.72);font-size:1.12rem;max-width:30em;margin:0 auto 26px;animation:up .8s .25s both}
.hsearch{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);border-radius:20px;padding:7px 7px 7px 18px;backdrop-filter:blur(10px);color:rgba(255,255,255,.75);animation:up .8s .35s both}
.hsearch:focus-within{border-color:#B9B2FF;background:rgba(255,255,255,.14)}
.hsearch input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:inherit;font-size:1.08rem;min-height:50px;padding:0}
.hsearch input::placeholder{color:rgba(255,255,255,.6)}
.hsearch input:focus{outline:none}
.hcta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;animation:up .8s .45s both}
.btn.glass{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.22)}
.hstats{display:flex;justify-content:center;gap:34px;margin-top:26px;animation:up .8s .55s both}
.hstats div{display:flex;flex-direction:column;align-items:center}
.hstats b{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hstats span{font-size:.82rem;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
/* yüzen öğeler */
.hfloat{position:absolute;z-index:2;display:none;pointer-events:none}
@media(min-width:1100px){.hfloat{display:block}}
.hl{left:6%;top:250px;animation:floaty 6s ease-in-out infinite}
.hr{right:6%;top:230px;animation:floaty 7s ease-in-out -2s infinite}
@keyframes floaty{50%{transform:translateY(-16px)}}
.tiles2{display:grid;grid-template-columns:repeat(2,64px);gap:9px;transform:rotate(-9deg)}
.tiles2 i{position:relative;height:64px;border-radius:18px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:1.25rem;border-bottom:6px solid rgba(0,0,0,.25);box-shadow:0 18px 30px rgba(0,0,0,.35)}
.tiles2 .t0{background:#3A5BFF;color:#fff}.tiles2 .t1{background:#E5384F;color:#fff}.tiles2 .t2{background:#FFB548;color:#19172F}.tiles2 .t3{background:#36CFA8;color:#19172F;animation:tp 2.4s ease-in-out infinite}
.tiles2 em{position:absolute;right:-8px;top:-10px;width:30px;height:30px;border-radius:50%;background:#fff;color:#12A57C;display:grid;place-items:center}
@keyframes tp{50%{transform:scale(1.1) rotate(-3deg)}}
.chart{position:relative;width:230px;padding:16px;border-radius:24px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);box-shadow:0 20px 40px rgba(0,0,0,.35);transform:rotate(6deg)}
.chart>svg{display:block;width:100%}
.chart>span{display:block;margin-top:6px;font-weight:800;font-size:.9rem;color:rgba(255,255,255,.85)}
.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s .9s ease-out forwards}
.ar{opacity:0;animation:fadein 1.2s 1.8s forwards}.dt{opacity:0;animation:fadein .5s 3.1s forwards}
.ringw{position:absolute;right:-22px;top:-26px;width:62px;height:62px;border-radius:50%;background:#19172F;padding:6px;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.rg{stroke-dasharray:1;stroke-dashoffset:1;animation:ringd 2s 1.2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fadein{to{opacity:1}}@keyframes ringd{to{stroke-dashoffset:.26}}
@media (prefers-reduced-motion:reduce){.ln,.rg{stroke-dashoffset:0!important}.rg{stroke-dashoffset:.26!important}.ar,.dt{opacity:1!important}}
/* yelpaze kartlar */

/* yeni giriş animasyonları */
.ix-drop{animation:ixdrop .7s cubic-bezier(.3,1.4,.5,1)}
.ix-flip{animation:ixflip .8s ease-out}
.ix-bounce{animation:ixbounce .9s ease-out}
.ix-shake{animation:ixshake .7s ease-out}
.ix-rise{animation:ixrise .7s ease-out}
@keyframes ixdrop{from{transform:translateY(-120px);opacity:0}to{transform:none;opacity:1}}
@keyframes ixflip{from{transform:rotateY(180deg) scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes ixbounce{0%{transform:scale(.2);opacity:0}50%{transform:scale(1.25);opacity:1}70%{transform:scale(.9)}100%{transform:none}}
@keyframes ixshake{0%{transform:translateX(-30px) rotate(-10deg);opacity:0}30%{transform:translateX(18px) rotate(8deg);opacity:1}60%{transform:translateX(-10px) rotate(-4deg)}100%{transform:none}}
@keyframes ixrise{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}

function syncCatalog(){
  if(DB.catalogVersion===CATALOG_VERSION)return false;
  const old=DB.cats||[],byPath=new Map(),used=new Set(),idMap=new Map();
  const rootOf=c=>{let p=c;while(p&&p.p)p=old.find(x=>x.id===p.p);return p};
  const pathOf=c=>{const r=rootOf(c),root=MAIN_RENAMES[r?r.n:'']||(r?r.n:''),main=c.p?(CHILD_PARENT_RENAMES[c.n]||root):root,name=c.p?(CHILD_RENAMES[c.n]||c.n):main;return `${main}\u0000${name}`};
  old.forEach(c=>byPath.set(pathOf(c),c));
  let serial=Math.max(0,...old.map(c=>+String(c.id).replace(/^c/, '')||0));
  const take=(path,base)=>{const found=byPath.get(path);if(found&&!used.has(found.id)){used.add(found.id);return found}return {...base,id:'c'+(++serial)}};
  const next=[],mainIds=new Map();
  TREE.forEach(([name,icon,color,subs])=>{
    const main=take(`${name}\u0000${name}`,{n:name,i:icon,c:color,p:null});
    main.n=name;main.i=icon;main.c=color;main.p=null;next.push(main);mainIds.set(name,main.id);idMap.set(main.id,main.id);
    subs.forEach(sub=>{const child=take(`${name}\u0000${sub}`,{n:sub,i:icon,c:color,p:main.id});child.n=sub;child.i=icon;child.c=color;child.p=main.id;next.push(child);idMap.set(child.id,child.id)});
  });
  old.filter(c=>!used.has(c.id)).forEach(c=>{
    const target=REMOVED_CATEGORY_FALLBACKS[c.n];
    if(target){const replacement=next.find(x=>x.n===target[1]&&x.p===mainIds.get(target[0]));if(replacement){idMap.set(c.id,replacement.id);return}}
    next.push(c);
  });
  const liveIds=new Set(next.map(c=>c.id)),remap=id=>idMap.get(id)||id;
  DB.cats=next;
  DB.quizzes.forEach(q=>{q.cat=remap(q.cat);(q.qs||[]).forEach(x=>{x.cat=remap(x.cat);x.sub=remap(x.sub)})});
  (DB.extra||[]).forEach(q=>q.cat=remap(q.cat));(DB.sugs||[]).forEach(q=>q.cat=remap(q.cat));
  const remapStats=stats=>{const result={};Object.entries(stats||{}).forEach(([id,v])=>{const to=remap(id);if(!liveIds.has(to))return;const prev=result[to]||{a:0,c:0};result[to]={...v,a:(prev.a||0)+(v.a||0),c:(prev.c||0)+(v.c||0)}});return result};
  Object.values(DB.users||{}).forEach(u=>{
    u.follows=[...new Set((u.follows||[]).map(remap).filter(id=>liveIds.has(id)))];
    u.cat=remapStats(u.cat);u.sub=remapStats(u.sub);
  });
  DB.s.groups=GROUP_NAMES.map(group=>group.map(name=>mainIds.get(name)));
  DB.catalogVersion=CATALOG_VERSION;
  return true;
}

    }else if(S.fb){

function selectHeroQuizzes(quizzes,limit=9,random=Math.random,previousIds=[]){
  const shuffle=items=>{const out=[...items];for(let i=out.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out};
  const groups=new Map();
  for(const q of shuffle(quizzes.filter(q=>q.st!=='taslak'&&cat(q.cat)&&mainOf(q.cat)))){
    const key=mainOf(q.cat).id;
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(q);
  }
  const mains=shuffle([...groups.keys()]),selected=[],usedCats=new Set();
  while(selected.length<limit){
    let added=false;
    for(const key of mains){
      const group=groups.get(key);
      while(group.length&&usedCats.has(group[0].cat))group.shift();
      if(!group.length)continue;
      const q=group.shift();selected.push(q);usedCats.add(q.cat);added=true;
      if(selected.length===limit)break;
    }
    if(!added)break;
  }
  if(selected.length>1&&previousIds.length===selected.length&&selected.every((q,i)=>q.id===previousIds[i]))selected.push(selected.shift());
  return selected;
}

function countUp(){
  const els=document.querySelectorAll('[data-n]');

  els.forEach(e=>{
    const to=+e.dataset.n;if(reduce){e.textContent=to;return}
    const t0=performance.now(),d=1400;
    const step=t=>{const p=Math.min(1,(t-t0)/d);e.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1&&document.body.contains(e))requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}
const slotOf=(i,a,n)=>{const h=Math.floor(n/2);return ((i-a+h+n*3)%n)-h};
function initFan(root){
  if(!root||!root.querySelectorAll)return null;
  const cards=[...root.querySelectorAll('.fc')],n=cards.length;
  if(n<3)return null;
  const hero=!!root.closest('#hero');
  let active=hero?Math.floor(n/2):Math.min(2,n-1),lock=performance.now()+1600,last=0;
  const setK=()=>{const w=root.parentElement?root.parentElement.clientWidth:innerWidth,k=Math.min(1,Math.max(.5,(w||1180)/1180));root.style.setProperty('--k',k);if(hero)root.style.setProperty('--hero-arrow-offset',`${150*k+62}px`)};
  function layout(){cards.forEach((c,i)=>{const o=slotOf(i,active,n);c.dataset.slot=o;c.classList.toggle('hid',Math.abs(o)>2);if(hero){c.querySelector('.hero-card-hit').tabIndex=o===0?0:-1;c.setAttribute('aria-current',o===0?'true':'false')}})}
  function go(i,o){active=i;last=o;lock=performance.now()+650;layout()}
  if(!hero){
    root.addEventListener('pointermove',e=>{
      const c=e.target.closest&&e.target.closest('.fc');
      if(!c){last=0;return}
      const o=+c.dataset.slot;
      if(o===0){last=0;return}
      if(performance.now()<lock||o===last)return;
      go(cards.indexOf(c),o);
    });
    root.addEventListener('pointerleave',()=>{last=0});
    cards.forEach(c=>c.addEventListener('focus',()=>{if(+c.dataset.slot!==0)go(cards.indexOf(c),0)}));
  }
  const rz=()=>{if(!root.isConnected){removeEventListener('resize',rz);return}setK()};
  addEventListener('resize',rz);setK();layout();
  if(hero){
    const reduce=matchMedia('(prefers-reduced-motion: reduce)');
    const abort=new AbortController();let timer=null,expanded=null;
    const clearAuto=()=>{if(timer){clearTimeout(timer);timer=null}};
    const schedule=()=>{clearAuto();const focused=root.contains(document.activeElement);if(!root.isConnected||cards.some(c=>c.matches(':hover'))||expanded||document.hidden||reduce.matches||focused)return;timer=setTimeout(()=>{active=(active+1)%n;layout();schedule()},5000);TIMERS.push(timer)};
    const closeCard=()=>{if(!expanded)return;expanded.classList.remove('is-open');expanded.querySelector('.hero-card-hit').setAttribute('aria-expanded','false');expanded.querySelector('.hero-card-play').tabIndex=-1;expanded=null;schedule()};
    const step=d=>{
      const wasOpen=!!expanded;
      if(wasOpen){
        expanded.classList.remove('is-open');
        expanded.querySelector('.hero-card-hit').setAttribute('aria-expanded','false');
        expanded.querySelector('.hero-card-play').tabIndex=-1;
      }
      active=(active+d+n)%n;
      layout();
      if(wasOpen){
        expanded=cards[active];
        expanded.classList.add('is-open');
        expanded.querySelector('.hero-card-hit').setAttribute('aria-expanded','true');
        expanded.querySelector('.hero-card-play').tabIndex=0;
        root.classList.add('is-stepping-open');
        clearAuto();
        setTimeout(()=>root.classList.remove('is-stepping-open'),350);
      }else schedule();
    };
    root.addEventListener('pointerover',e=>{if(e.pointerType==='mouse'&&e.target.closest('.fc'))clearAuto()},{signal:abort.signal});
    root.addEventListener('pointerout',e=>{if(e.pointerType==='mouse')setTimeout(schedule,0)},{signal:abort.signal});
    root.addEventListener('focusin',()=>clearAuto(),{signal:abort.signal});
    root.addEventListener('focusout',()=>setTimeout(schedule,0),{signal:abort.signal});
    document.addEventListener('visibilitychange',schedule,{signal:abort.signal});
    reduce.addEventListener('change',schedule,{signal:abort.signal});
    root._fan={step};
    cards.forEach((c,i)=>c.querySelector('.hero-card-hit').addEventListener('click',()=>{if(expanded===c){closeCard();return}closeCard();active=i;layout();expanded=c;c.classList.add('is-open');c.querySelector('.hero-card-hit').setAttribute('aria-expanded','true');c.querySelector('.hero-card-play').tabIndex=0;clearAuto()},{signal:abort.signal}));
    document.addEventListener('click',e=>{if(expanded&&!expanded.contains(e.target)&&!e.target.closest('.hero-fan-arrow')){closeCard();if(root.contains(document.activeElement)&&document.activeElement.blur)document.activeElement.blur();schedule()}},{signal:abort.signal});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&expanded){closeCard();expanded=null}},{signal:abort.signal});
    FAN_CLEANUPS.push(()=>{abort.abort();clearAuto();removeEventListener('resize',rz)});
    schedule();
  }else root._fan={step(d){active=(active+d+n)%n;lock=performance.now()+650;layout()}};
  return root._fan;
}

function initDailyTilt(){
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  if(reduced.matches)return;
  document.querySelectorAll('.daily-card').forEach(card=>{
    const state={x:0,y:0,vx:0,vy:0,tx:0,ty:0,frame:0,rect:null,last:0};
    const animate=now=>{
      state.frame=0;
      if(!card.isConnected||reduced.matches)return;
      const dt=Math.min(.032,(now-(state.last||now-16))/1000);state.last=now;
      state.vx+=((state.tx-state.x)*300-state.vx*22)/.5*dt;
      state.vy+=((state.ty-state.y)*300-state.vy*22)/.5*dt;
      state.x+=state.vx*dt;state.y+=state.vy*dt;
      card.style.setProperty('--tilt-x',`${state.x.toFixed(2)}deg`);
      card.style.setProperty('--tilt-y',`${state.y.toFixed(2)}deg`);
      card.style.setProperty('--float-x',`${(state.y*1.05).toFixed(2)}px`);
      card.style.setProperty('--float-y',`${(-state.x*.75).toFixed(2)}px`);
      if(Math.abs(state.tx-state.x)+Math.abs(state.ty-state.y)+Math.abs(state.vx)+Math.abs(state.vy)>.04)state.frame=requestAnimationFrame(animate);
      else if(!card.classList.contains('is-tilting')){card.style.removeProperty('--tilt-x');card.style.removeProperty('--tilt-y');card.style.removeProperty('--float-x');card.style.removeProperty('--float-y')}
    };
    const schedule=()=>{if(!state.frame){state.last=0;state.frame=requestAnimationFrame(animate)}};
    card.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')state.rect=card.getBoundingClientRect()});
    card.addEventListener('pointermove',e=>{
      if(e.pointerType!=='mouse'||reduced.matches)return;
      const r=state.rect||card.getBoundingClientRect(),x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
      card.classList.add('is-tilting');
      const sensitivity=v=>Math.tanh(v*3.2)/Math.tanh(1.6)*11;
      state.tx=sensitivity(.5-y);state.ty=sensitivity(x-.5);
      card.style.setProperty('--shine-x',`${(x*100).toFixed(1)}%`);
      card.style.setProperty('--shine-y',`${(y*100).toFixed(1)}%`);
      schedule();
    });
    const reset=()=>{state.rect=null;state.tx=0;state.ty=0;card.classList.remove('is-tilting');schedule()};
    card.addEventListener('pointerleave',reset);
    card.addEventListener('pointercancel',reset);
    card.addEventListener('focusin',reset);
  });
}

const stoneTime=L=>{const t=DB.s.stoneTimes[L];return t>0?t:Math.max(20,DB.s.stoneBase-(L-1)*DB.s.stoneStep)};
const groupOf=L=>DB.s.groups[Math.floor((L-1)/5)%DB.s.groups.length];
function journeyFail(u,msg){u.j.active=false;u.j.cool=Date.now()+DB.s.cool*60000;save()}
V.yolculuk=()=>{
  const u=U();
  if(!u)return setApp(`<section class="mode-entry journey-entry" aria-labelledby="journey-title"><div class="mode-entry-intro"><h1 id="journey-title">Yolculuk</h1><p>Taşları geçerek seviyeni yükselt. İlerlemen hesabına kaydedilir; başlamak için giriş yap.</p></div><div class="mode-entry-form"><p class="mut">Bir hesabın varsa kaldığın yerden devam et.</p><a class="btn pri" href="#/giris">Giriş yap</a><a class="btn out" href="#/kayit">Hesap aç</a></div></section>`);
  if(u.j.active){journeyFail(u);toast('Yarım bıraktığın deneme yanlış sayıldı.')}
  const j=u.j,now=Date.now(),L=j.level,cool=j.cool>now;
  const st=eqItem(u,'stone'),sty=st?`background:${st.d.c};border-radius:${st.d.r};border-color:${st.d.c};color:var(--ink)`:'';
  let lv='';
  for(let s=5;s>=1;s--){
    const state=s<j.stone?'done':s===j.stone?(cool?'cool':'cur'):'';
    lv+=`<div class="stone ${state} ${s===5?'final':''}" style="${state==='done'&&sty?sty:''}" aria-label="Taş ${s}, ${state==='done'?'geçildi':state==='cur'?'şu anki taş':state==='cool'?'bekleme':'kilitli'}">${state==='done'?gl('check',30):state==='cool'?gl('clock',30):state==='cur'?s:gl('lock',26)}<small>${s===5?'Seviye atlama':'Taş '+s}</small></div>${s>1?`<div class="seg ${s<=j.stone?'d':''}"></div>`:''}`;
  }
  const grp=groupOf(L).map(id=>cat(id).n);
  setApp(`<div class="journey-entry"><p class="eyebrow">Yolculuk</p><h1>Seviye ${L}</h1>
   <div class="card"><div class="row between"><div><b>Şu anki taş: ${j.stone}${j.stone===5?' (süreli · '+fmtT(stoneTime(L))+')':''}</b><p class="mut sm" style="margin:0">Alanlar: ${grp.map(esc).join(', ')}</p></div>
   <div>${cool?`<span class="tag" id="cd">Bekleme: ${fmtLeft(j.cool-now)}</span>`:`<button class="btn pri" data-a="jstart">Taşa gir</button>`}</div></div>
   <p class="mut sm" style="margin-top:10px">Her taşta 5 soru var ve her biri farklı bir alandan gelir. Tek yanlış denemeyi bitirir. Başarısız olursan aynı taşı ${DB.s.cool/60} saat sonra yeniden denersin; geçtiğin taşlar kaybolmaz.</p></div>
   <div class="card sec"><div class="path" aria-label="Seviye ${L} yolu">${lv}</div><p class="mut sm" style="text-align:center">Seviye ${L-1>0?(L-1)+' seviye tamamlandı':'yolculuğun başlangıcı'}</p></div></div>`);
  if(cool)every(()=>{const e=$('#cd'),l=u.j.cool-Date.now();if(l<=0)route();else if(e)e.textContent='Bekleme: '+fmtLeft(l)},1000);
};
A.jstart=()=>{
  const u=U();if(!u)return;const j=u.j,L=j.level;
  if(j.cool>Date.now())return toast('Bu taş için bekleme sürüyor.');
  const grp=shuffle(groupOf(L)),qs=[],need=L<=3?1:L<=8?2:3;
  for(const mid of grp){
    const pool=poolFor(mid).filter(q=>!j.seen[q.id]);
    if(!pool.length)return toast('“'+cat(mid).n+'” alanında yeni soru kalmadı. Yönetici soru ekleyince devam edebilirsin.');
    const best=pool.sort((a,b)=>Math.abs(a.d-need)-Math.abs(b.d-need));
    const top=best.filter(q=>Math.abs(q.d-need)===Math.abs(best[0].d-need));
    qs.push(rnd(top));
  }
  j.active=true;save();
  const timed=j.stone===5,stoneNo=j.stone;
  play({qs,title:`Seviye ${L} · Taş ${stoneNo}`,instant:true,failFast:true,limit:timed?stoneTime(L):0,
    onShow:q=>{u.j.seen[q.id]=1;save()},
    onAbort:()=>{if(U()&&U().j.active){journeyFail(U())}},
    onEnd:res=>{
      const pass=res.ok.every(Boolean)&&res.ok.length===5;
      u.j.active=false;
      if(pass){
        bump('stone');
        if(stoneNo===5){u.j.level++;u.j.stone=1}else u.j.stone++;
        act(u,`Yolculuk: Seviye ${L} taş ${stoneNo} geçildi`);checkBadges();save();
        setApp(`<div class="run"><div class="card" style="text-align:center"><p class="eyebrow">Taş geçildi</p><h1>${stoneNo===5?'Seviye '+L+' tamamlandı!':'Harika!'}</h1><p class="mut">${stoneNo===5?'Seviye '+(L+1)+' seni bekliyor.':'Sıradaki taş açıldı.'}</p><a class="btn pri" href="#/yolculuk">Yol haritası</a></div></div>`);
      }else{
        journeyFail(u);
        setApp(`<div class="run"><div class="card" style="text-align:center"><p class="eyebrow">${res.reason==='time'?'Süre doldu':'Deneme bitti'}</p><h1>Bu taşta kaldın</h1><p class="mut">Geçtiğin taşlar durur. Aynı taşı ${DB.s.cool/60} saat sonra yeniden deneyebilirsin; yeni denemede 5 soru da değişir.</p><a class="btn pri" href="#/yolculuk">Yol haritası</a></div></div>`);
      }
    }});
};

A.duel=t=>duelRun(t.dataset.m||'friend');
function duelRun(mode){
  const u=U();if(!u)return go('#/giris');
  const names=['Bilim','Genel Kültür','Tarih','Spor','Coğrafya'];
  const qs=names.map(nm=>{const m=MAINS().find(c=>c.n===nm);return rnd(poolFor(m.id))});
  const D={r:0,me:0,op:0,tm:0,to:0,ans:null,opA:null,phase:'wait',ms:0,start:0,opMs:0};
  const sec=DB.s.duelSec;
  const intro=eqItem(u,'intro');
  setApp(`<div class="card" style="text-align:center;max-width:520px;margin:30px auto"><div class="spinner"></div><h2 style="margin-top:18px">Rakip aranıyor…</h2><p class="mut">Beceri puanın: ${u.skill}</p><button class="btn out" data-a="dquit">Vazgeç</button></div>`);
  CUR={abort(){}, dquit(){go('#/duello')}};
  later(()=>{
    if(!CUR)return;
    setApp(`<div class="card" style="max-width:560px;margin:30px auto"><div class="vs"><div>${avatar(u,64)}<br><b>${nameHtml(u)}</b></div><b class="${intro?intro.d.k:''}" style="font-size:2rem">VS</b><div><span class="av" style="width:64px;height:64px"><svg viewBox="0 0 100 100" width="52" height="52" aria-hidden="true">${AVA.av1}</svg></span><br><b>Demo Rakip</b></div></div><p class="mut" style="text-align:center;margin-top:14px">${mode==='ranked'?'Sıralamalı':'Özel'} demo maç · kredi ve puan etkilenmez</p></div>`);
    later(round,1800);
  },1800);
  function round(){
    if(!CUR)return;D.phase='ans';D.ans=null;D.start=Date.now();D.end=D.start+sec*1000;
    const q=qs[D.r],opOk=Math.random()<.6,opDelay=2000+Math.random()*(sec*600);
    D.opA=opOk?q.a:rnd([0,1,2,3].filter(x=>x!==q.a));D.opAt=D.start+opDelay;
    drawQ();
  }
  function drawQ(){
    const q=qs[D.r];
    setApp(`<div class="run"><div class="qhead"><div><b>Tur ${D.r+1} / 5 · ${names[D.r]}</b><br><span class="mut sm">Sen ${D.me} · Rakip ${D.op}</span></div><div class="clock" id="clk" role="timer"></div></div><div class="bar"><i style="width:${D.r/5*100}%"></i></div>
     <div class="card"><h2 class="qt">${esc(q.q)}</h2><div class="opts tiles">${q.o.map((o,k)=>`<button class="opt t${k} ${D.ans===k?'sel':''}" data-a="dpick" data-v="${k}" ${D.ans!=null?'disabled':''}><i>${LET[k]}</i>${esc(o)}</button>`).join('')}</div>
     <p class="mut sm" style="margin-top:12px">${D.ans!=null?'Cevabın gönderildi. Rakibi bekliyorsun…':'Rakibin cevabı tur bitene kadar görünmez.'}</p><div class="acts"><button class="btn out sm" data-a="dquit2">Bağlantıyı kopar (demo)</button></div></div></div>`);
    tickD();
  }
  function tickD(){
    const el=$('#clk');if(el){const s=(D.end-Date.now())/1000;el.textContent=fmtT(s);el.classList.toggle('low',s<5)}
    if(D.phase!=='ans')return;
    const opDone=Date.now()>=D.opAt;
    if((D.ans!=null&&opDone)||Date.now()>=D.end)reveal();
  }
  every(tickD,300);
  function reveal(){
    if(D.phase!=='ans')return;D.phase='rev';
    const q=qs[D.r],now=Date.now();
    const myOk=D.ans===q.a,opOk=D.opA===q.a;
    if(myOk)D.me++;if(opOk)D.op++;
    D.tm+=D.ans!=null?D.ms:sec*1000;D.to+=Math.min(D.opAt,D.end)-D.start;
    const last=D.r===4;
    setApp(`<div class="run"><div class="qhead"><b>Tur ${D.r+1} sonucu</b><span class="tag">Skor ${D.me*10} – ${D.op*10}</span></div><div class="card"><h2 class="qt">${esc(q.q)}</h2>
     <div class="opts">${q.o.map((o,k)=>`<div class="opt ${k===q.a?'good':(k===D.ans||k===D.opA?'bad':'')}"><i>${LET[k]}</i><span style="flex:1">${esc(o)}</span><span class="tag">${k===D.ans?'Sen ':''}${k===D.opA?'Rakip':''}</span></div>`).join('')}</div>
     <p style="margin-top:12px">Sen: ${D.ans==null?'Süre doldu':(myOk?'Doğru':'Yanlış')} · Rakip: ${opOk?'Doğru':'Yanlış'}</p><p class="mut">${esc(q.e)}</p>
     <div class="acts"><button class="btn pri grow" data-a="dnext">${last?'Maçı bitir':'Sonraki tur'}</button></div></div></div>`);
  }
  CUR.dpick=k=>{if(D.phase!=='ans'||D.ans!=null)return;D.ans=k;D.ms=Date.now()-D.start;drawQ()};
  CUR.dnext=()=>{if(D.r>=4)finish('done');else{D.r++;round()}};
  CUR.dquit2=()=>finish('drop');
  function finish(why){
    CUR=null;u.duels++;act(u,'Düello oynadı (demo)');
    const win=D.me>D.op||(D.me===D.op&&D.tm<D.to),draw=D.me===D.op&&D.tm===D.to;
    if(why==='done'){bump('duel');if(win&&!draw){u.dw=(u.dw||0)+1;bump('duelwin')}}
    checkBadges();save();
    setApp(`<div class="run"><div class="card" style="text-align:center"><p class="eyebrow">${why==='drop'?'Bağlantı koptu · maç bitti':'Maç bitti'}</p><h1>${why==='drop'?'Maç yarıda kaldı':(draw?'Berabere':win?'Kazandın!':'Rakip kazandı')}</h1>
     <div class="score">${D.me*10} – ${D.op*10}</div><p class="mut">Toplam süre: ${(D.tm/1000).toFixed(1)} sn – ${(D.to/1000).toFixed(1)} sn</p>
     <p class="tag">Demo maç: kredi ve beceri puanı değişmedi</p><div class="row" style="justify-content:center;margin-top:12px"><a class="btn pri" href="#/duello">Düelloya dön</a></div></div></div>`);
  }
}
A.dquit=()=>CUR&&CUR.dquit&&CUR.dquit();A.dpick=t=>CUR&&CUR.dpick&&CUR.dpick(+t.dataset.v);A.dnext=()=>CUR&&CUR.dnext&&CUR.dnext();A.dquit2=()=>CUR&&CUR.dquit2&&CUR.dquit2();

function board(t0,t1,cid){
  const rows=[];
  Object.values(DB.users).forEach(u=>{
    const s=new Set();
    u.log.forEach(l=>{if(l.ok&&l.t>=t0&&(!t1||l.t<=t1)&&(!cid||l.c===cid))s.add(l.q)});
    if(s.size)rows.push({u,p:s.size*10});
  });
  return rows.sort((a,b)=>b.p-a.p);
}

function bProg(u,b){

}
function tkCd(kind){

  return (dd?dd+' g ':'')+p(h)+':'+p(m)+':'+p(sc);
}

A.claim=t=>{
  const u=U(),m=DB.missions.find(x=>x.id===t.dataset.m);if(!u||!m||m.badge)return;
  const ck=claimKey(m);
  if(u.claimed[ck]||!mProg(u,m).done)return;
  u.claimed[ck]=1;u.mc=(u.mc||0)+1;
  const r=m.reward>0?m.reward:0;u.credits+=r;u.mcr=(u.mcr||0)+r;
  act(u,'Görev tamamlandı: '+m.t);save();chrome();
  toast(r?'+'+r+' kredi kazandın':'Görev tamamlandı');
  const y=window.scrollY;V.gorevler();window.scrollTo(0,y);
};

    case 'theme':return `<span class="mgth" style="background:${d.a};color:${d.b};border-color:${d.b}"><b>Profil kartı</b><i style="background:${d.b}"></i><i style="background:${d.b}"></i></span>`;
    case 'intro':return `<span class="mgin"><span class="${d.k}" style="display:grid">${gl(d.g,50,'#fff')}</span></span>`;
    case 'fx':return `<span class="mgfx">${gl(d.g,30,FXCOL[d.g])}${gl(d.g,54,FXCOL[d.g])}${gl(d.g,30,FXCOL[d.g])}</span>`;

    case 'icon':return `<span class="mgic"><b>Oyuncu</b>${gl(d.g,34,'#FFD25E')}</span>`;
  }
  return pvChar(it,112);
}

function pubProfile(o){
  const pb=o.ch.pbg&&CHD[o.ch.pbg]?`<div class="pbgl ${CHD[o.ch.pbg].d.cls}" aria-hidden="true"></div>`:'';
  const ch=o.ch;
  const earned=o.badgeIds?BADGES.filter(b=>o.badgeIds.includes(b.id)):null;
  const showB=earned?(PFX.r?earned:earned.slice(0,6)):[];
  const tiles=o.tiles?`<div class="pfs3 pfs4">${o.tiles.map(x=>`<div class="pfc pfsc"><span class="pfsi">${gl(x[0],30)}</span><div><em>${x[2]}</em><b>${x[1]}</b></div></div>`).join('')}</div>`:`<div class="pfc" style="margin:16px 0"><p class="pfnote" style="margin:0">Bu oyuncu istatistiklerini gizledi.</p></div>`;
  const catItems=[...o.cats].filter(x=>x.a>0).sort((a,b)=>b.a-a.a).slice(0,6).map(x=>({v:'%'+x.p,h:x.p,l:pfShort(x.m.n)}));
  const left=o.tiles?pfCard('Yetenek takibi',`${catItems.length?pfBars(catItems):pfBars([],true)}<p class="pfnote">Çözdüğü konulardaki doğruluk oranı</p>`):'';
  const right=earned?pfCard('Rozetler',earned.length?`<div class="pfbg3">${showB.map(b=>tkBadge(o.pu,b)).join('')}</div>${pfMore('r',earned.length-6)}`:'<p class="pfnote" style="margin:0">Henüz rozet yok.</p>',{pill:`<span class="pfpill">${earned.length} rozet</span>`}):'';
  const wl=pfWornList(o.eq||o.ch),worn=o.worn===false?'':pfCard('Kullandığı ürünler',pfWornHtml(wl),{pill:`<span class="pfpill">${wl.filter(x=>x.t===2).length} premium</span>`});
  setApp(`<div class="pfp">${pb}<section class="pfh"><div class="pfhl"><p class="pfk">Oyuncu profili${o.win?pfCrown():''}</p><h1 class="pft">${o.name}</h1><p class="pfbio">${esc(o.bio)||'Henüz biyografi yok.'}</p><a class="pfback" href="#/siralamalar">${gl('arrow',14)} Sıralamalara dön</a></div>
   <div class="pfdial">${pfDial({cats:o.cats})}<span class="pfav ${o.intro||''}">${chAvatar(ch,200)}</span></div></section>${tiles}
   ${left||right?`<div class="pfgrid"><div class="pfcol">${left}</div><div class="pfcol">${right}</div></div>`:''}${worn?`<div class="pfcol" style="margin-top:16px">${worn}</div>`:''}</div>`);
}
function botPage(b){
  const M=MAINS(),fav=M[b.fav],w=pfWinner();
  const cats=M.map((m,k)=>{const rt=b.rates[k]||0;return {m,a:Math.round(rt*20),c:0,p:rt?Math.min(99,Math.round(b.acc-6+rt*2)):0}});
  const n=Math.max(2,Math.round(15-b.rk*.24)),ids=BADGES.map(x=>x.id).slice(0,Math.min(BADGES.length,n));
  const pu={badges:ids,cat:{},done:{},m:{},j:{level:b.lv,stone:1,cool:0},duels:3,dw:2,ms:b.st,streak:b.st,owned:[],skill:b.sk,bestExam:90,life:{},log:[],eq:{}};
  pubProfile({name:esc(b.n),bio:`${fav?fav.n:'Quiz'} tutkunu · ${b.boss?'Kategori lideri':'Seviye '+b.lv}`,ch:b.ch,cats,win:!!(w&&w.k==='b'&&w.b.id===b.id),
    tiles:[['star',fmtN(b.sk),'BECERİ PUANI'],['flag',b.lv,'YOLCULUK SEVİYESİ'],['target','%'+b.acc,'DOĞRULUK'],['flame',b.st+' gün','SERİ']],badgeIds:ids,pu,eq:b.ch});
}
V.u=name=>{
  name=decodeURIComponent(name||'');const key=name.toLowerCase(),u=DB.users[key];

    b=`<div class="grid g3"><div class="card"><span class="mut sm">Kullanıcı</span><h2>${us.length}</h2></div><div class="card"><span class="mut sm">Çözülen soru</span><h2>${tot}</h2></div><div class="card"><span class="mut sm">Quiz çözümü</span><h2>${DB.quizzes.reduce((s,q)=>s+q.plays,0)}</h2></div><div class="card"><span class="mut sm">Bekleyen öneri</span><h2>${DB.sugs.filter(s=>s.st==='bekliyor').length}</h2></div><div class="card"><span class="mut sm">Açık bildirim</span><h2>${DB.reports.filter(r=>r.open).length}</h2></div></div>
     <div class="card sec tw"><h3>Kategori başına doğruluk</h3><table><tr><th>Kategori</th><th>Cevap</th><th>Doğruluk</th></tr>${MAINS().map(m=>{const a=us.reduce((s,x)=>s+(x.cat[m.id]?x.cat[m.id].a:0),0),c=us.reduce((s,x)=>s+(x.cat[m.id]?x.cat[m.id].c:0),0);return `<tr><td>${esc(m.n)}</td><td>${a}</td><td>${a?'%'+Math.round(c/a*100):'-'}</td></tr>`}).join('')}</table></div>`;
  }
  setApp(`<p class="eyebrow">Yönetim</p><h1>Yönetim paneli</h1><div class="tabs">${AT.map(t=>`<a href="#/yonetim/${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</a>`).join('')}</div>${b}`);
};
const adm=()=>{const u=U();return u&&u.admin};
A.acadd=()=>{if(!adm())return;const n=$('#cn').value.trim(),p=$('#cp').value||null;if(!n)return toast('Ad yaz.');const par=p?cat(p):null;const main=p?mainOf(p):null;DB.cats.push({id:'c'+Date.now(),n,i:main?main.i:'pin',c:main?main.c:'#5C50F1',p});save();toast('Eklendi.');route()};
A.acrename=t=>{if(!adm())return;const c=cat(t.dataset.id);modal(`<h3>Adı değiştir</h3><input id="rn" value="${esc(c.n)}"><div class="row" style="margin-top:12px"><button class="btn pri" id="rok">Kaydet</button><button class="btn out" data-a="close">Vazgeç</button></div>`);$('#rok').onclick=()=>{const v=$('#rn').value.trim();if(v){c.n=v;save();closeModal();route()}}};
A.acdel=t=>{if(!adm())return;const id=t.dataset.id,ids=desc(id);if(DB.quizzes.some(q=>ids.includes(q.cat)))return toast('İçinde quiz olan kategori silinemez.');if(DB.extra.some(q=>ids.includes(q.cat)))return toast('İçinde soru olan kategori silinemez.');
  if(!cat(id).p&&MAINS().length<=5)return toast('En az 5 ana kategori kalmalı.');
  confirmBox('Kategoriyi sil',esc(cat(id).n)+' ve alt başlıkları silinecek.','Sil',()=>{DB.cats=DB.cats.filter(c=>!ids.includes(c.id));DB.s.groups=DB.s.groups.map(g=>g.map(x=>ids.includes(x)?MAINS()[0].id:x));save();route()})};
A.aqadd=()=>{if(!adm())return;const q=$('#qt').value.trim();if(!q)return toast('Soru metni yaz.');DB.extra.push({id:'x'+Date.now(),q,o:[0,1,2,3].map(k=>$('#qo'+k).value.trim()||'Cevap'),a:+$('#qa').value,e:$('#qe').value.trim(),d:+$('#qd').value,cat:$('#qc').value,st:'yayin'});save();toast('Havuza eklendi.');route()};
A.aqdel=t=>{if(!adm())return;DB.extra=DB.extra.filter(x=>x.id!==t.dataset.id);save();route()};
A.sugok=t=>{if(!adm())return;const id=+t.dataset.id,s=DB.sugs.find(x=>x.id===id);if(!s)return;DB.extra.push({id:'x'+id,q:s.text,o:[0,1,2,3].map(k=>$(`#so${id}-${k}`).value.trim()||'Cevap'),a:+$('#sa'+id).value,e:'Açıklama',d:+$('#sd'+id).value,cat:s.cat,st:'yayin'});s.st='yayinda';save();toast('Yayımlandı.');route()};
A.sugno=t=>{if(!adm())return;const s=DB.sugs.find(x=>x.id===+t.dataset.id);if(s)s.st='reddedildi';save();route()};
A.rpclose=t=>{if(!adm())return;const r=DB.reports.find(x=>x.id===+t.dataset.id);if(r)r.open=false;save();route()};
A.qztitle=(id,v)=>{if(!adm())return;const q=quiz(id);if(q&&v.trim()){q.t=v.trim();save()}};
A.qzfeat=(id,v)=>{if(!adm())return;quiz(id).feat=v;save()};
A.qzver=t=>{if(!adm())return;const q=quiz(t.dataset.id);q.ver++;save();toast('Yeni sürüm: '+q.ver+'. Eski sonuçlar eski sürümle saklanır.');route()};
A.qzst=t=>{if(!adm())return;const q=quiz(t.dataset.id);q.st=q.st==='taslak'?'yayin':'taslak';save();route()};
A.aqz=()=>{if(!adm())return;const t=$('#nq').value.trim(),c=$('#nc').value,n=Math.max(1,Math.min(50,+$('#nn').value||10));if(!t)return toast('Başlık yaz.');const id='q'+Date.now(),m=mainOf(c);
  DB.quizzes.push({id,t,cat:c,ver:1,feat:false,plays:0,at:DB.quizzes.length,st:'yayin',qs:Array.from({length:n},(_,j)=>({id:id+'-'+(j+1),q:'Soru '+(j+1),o:['Cevap A','Cevap B','Cevap C','Cevap D'],a:j%4,e:'Açıklama',d:1+j%3,cat:m.id,sub:c}))});save();toast('Quiz oluşturuldu.');route()};
A.setgrp=(gi,k,v)=>{if(!adm())return;DB.s.groups[gi][k]=v};
A.stt=(L,v)=>{if(!adm())return;if(+v>0)DB.s.stoneTimes[L]=+v;else delete DB.s.stoneTimes[L];save()};
A.svj=()=>{if(!adm())return;for(const g of DB.s.groups){if(new Set(g).size!==g.length)return toast('Bir grupta aynı alan iki kez seçilemez.')}DB.s.stoneBase=+$('#sb').value||90;DB.s.stoneStep=+$('#ss').value||0;DB.s.cool=+$('#sc').value||120;save();toast('Kaydedildi.')};
A.svd=()=>{if(!adm())return;DB.s.duelSec=+$('#d1').value||20;DB.s.duelCredit=+$('#d2').value||0;DB.s.duelBonus=+$('#d3').value||0;save();toast('Kaydedildi.')};
A.price=(id,v)=>{if(!adm())return;item(id).price=v===''?null:Math.max(0,Math.round(+v));save()};
A.sact=(id,v)=>{if(!adm())return;item(id).on=v;save()};
A.mset=(id,k,v)=>{if(!adm())return;const m=DB.missions.find(x=>x.id===id);m[k]=v===''?null:Math.max(0,+v);save()};
A.newseason=()=>{if(!adm())return;confirmBox('Yeni sezon','Mevcut sezon kapanır ve sıralamada geçmiş sezon olarak kalır.','Başlat',()=>{const s=DB.seasons[DB.seasons.length-1];s.b=Date.now();DB.seasons.push({id:s.id+1,n:'Sezon '+(s.id+1),a:Date.now(),b:null});save();route()})};

let PENDING_TRANSFER_TEXT=null;
V.aktar=()=>{
  PENDING_TRANSFER_TEXT=null;
  const originHelp=location.hostname==='quizlora.vercel.app'
    ? '<p class="transfer-origin-guide">Bu eski adreste kayıtlı verilerin varsa önce yedeğini indir. Ardından <a href="https://collon.vercel.app/#/aktar">Collon adresinde içe aktar</a>.</p>'
    : location.hostname==='collon.vercel.app'
      ? '<p class="transfer-origin-guide">Eski Quizlora adresinde kayıtlı verilerin varsa <a href="https://quizlora.vercel.app/#/aktar">eski adreste yedekle</a>, sonra buraya dönüp dosyayı içe aktar.</p>'
      : '';
  setApp(`<section class="transfer-page"><p class="eyebrow">Yerel veriler</p><h1>Verilerini yanında götür.</h1><p class="lead">Hesapların ve quiz ilerlemen bu tarayıcıda saklanır. Yeni bir adreste otomatik görünmez; yedeğini indirip yeni adreste içe aktarabilirsin.</p>
    ${originHelp}
    <div class="transfer-grid"><section class="card"><span class="transfer-step">01 / Dışa aktar</span><h2>Bu cihazdan yedekle</h2><p class="mut">Profil, ayarlar ve ilerleme bilgilerini yalnızca cihazına bir JSON dosyası olarak indirir.</p><button type="button" class="btn pri" data-a="transferExport">Yedeği indir</button></section>
    <section class="card"><span class="transfer-step">02 / İçe aktar</span><h2>Yedeğini geri yükle</h2><p class="mut">Dosya yalnızca bu tarayıcıda okunur. Mevcut kayıt, onay vermeden değişmez.</p><label for="transfer-file">Collon yedek dosyası (.json)</label><input id="transfer-file" type="file" accept="application/json,.json"><div id="transfer-preview" class="transfer-preview" hidden></div></section></div>
    <p class="transfer-notice">Yedek dosyası e-posta adresi, şifre özeti ve ilerleme verisi içerebilir. Özel tut; paylaşma. Eski adresteki verilerin içe aktarmadan sonra silinmez.</p><p id="transfer-status" class="mut" role="status" aria-live="polite"></p></section>`);
};
const transferStatus=(message,error=false)=>{const status=$('#transfer-status');if(status){status.textContent=message;status.classList.toggle('err',error)}};
A.transferExport=()=>{
  try {
    const text=JSON.stringify(window.CollonTransfer.makeExport(DB));
    if(new TextEncoder().encode(text).length>window.CollonTransfer.MAX_BYTES)throw new Error('Yedek 5 MB sınırını aşıyor; veriler bu tarayıcıda korunuyor.');
    const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
    const link=document.createElement('a');link.href=url;link.download='collon-yerel-yedek-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    transferStatus('İndirme başlatıldı. Kaydedilen dosyayı kontrol et; ardından yeni Collon adresinde içe aktar.');
  } catch(error) {transferStatus(error.message||'İndirme başarısız oldu. Tarayıcı izinlerini kontrol et.',true)}
};
async function transferSelect(file){
  PENDING_TRANSFER_TEXT=null;const preview=$('#transfer-preview');if(!preview)return;preview.hidden=true;preview.innerHTML='';
  if(!file)return;
  if(file.size>window.CollonTransfer.MAX_BYTES){transferStatus('Dosya 5 MB sınırını aşıyor.',true);return}
  let text;try{text=await file.text()}catch(error){transferStatus('Dosya okunamadı. Başka bir yedek seç.',true);return}
  const result=window.CollonTransfer.parseImport(text);
  if(!result.ok){transferStatus(result.error,true);return}
  PENDING_TRANSFER_TEXT=text;
  const summary=result.summary;
  preview.hidden=false;
  const title=document.createElement('h3');title.textContent='Yedek hazır';preview.append(title);
  const info=document.createElement('p');info.textContent=`${summary.users} profil · ${summary.categories} kategori · ${summary.quizzes} quiz`+(summary.activeProfile?` · Etkin profil: ${summary.activeProfile}`:'');preview.append(info);
  const label=document.createElement('label');label.className='transfer-confirm';
  const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.id='transfer-confirm';
  label.append(checkbox,document.createTextNode(' Bu adresteki mevcut yerel verinin üzerine yazılmasını onaylıyorum.'));preview.append(label);
  const action=document.createElement('button');action.type='button';action.className='btn pri';action.textContent='Onayla ve içe aktar';action.dataset.a='transferCommit';preview.append(action);
  transferStatus('Yedek doğrulandı. Mevcut verilerin değişmesi için onay kutusunu işaretle.');
}
document.addEventListener('change',event=>{if(event.target?.id==='transfer-file')transferSelect(event.target.files?.[0])});
A.transferCommit=()=>{
  if(!$('#transfer-confirm')?.checked){transferStatus('İçe aktarmak için üzerine yazma onayını işaretle.',true);return}
  const result=window.CollonTransfer.parseImport(PENDING_TRANSFER_TEXT);
  if(!result.ok){transferStatus(result.error,true);return}
  try {localStorage.setItem('qz_db',JSON.stringify(result.data));location.reload()}
  catch(error) {transferStatus('Tarayıcı depolaması dolu veya engelli. Mevcut verilerin korundu; yer açıp tekrar dene.',true)}
};

V.nf=()=>setApp(`<div class="card empty"><h2>Sayfa bulunamadı</h2><a class="btn pri" href="#/">Ana sayfaya dön</a></div>`);

/* ================= yönlendirici ================= */
function route(){
  FAN_CLEANUPS.forEach(fn=>fn());FAN_CLEANUPS=[];
  const hr=$('#hero');if(hr)hr.innerHTML='';
  if(CUR&&CUR.abort){try{CUR.abort()}catch(e){}}CUR=null;
  TIMERS.forEach(t=>{clearInterval(t);clearTimeout(t)});TIMERS=[];
  closeModal();
  rememberRoute();
  let h=(location.hash||'#/').slice(1);let arg='';
  const qi=h.indexOf('?');if(qi>=0){arg=h.slice(qi+1);h=h.slice(0,qi)}
  const p=h.split('/').filter(Boolean),r=p[0]||'home',a=p[1];
  const map={home:()=>V.home(),gunluk:()=>V.gunluk(a),kesfet:()=>V.kesfet(arg),kategori:()=>V.kategori(a),quiz:()=>V.quiz(a),oyna:()=>V.oyna(a),modlar:()=>V.modlar(),sonsuz:()=>go('#/modlar'),sinav:()=>V.sinav(a),yolculuk:()=>V.yolculuk(),duello:()=>V.duello(),siralamalar:()=>V.siralamalar(arg),gorevler:()=>V.gorevler(),magaza:()=>V.magaza(arg),giris:()=>V.giris(),kayit:()=>V.kayit(),seviye:()=>V.seviye(),profil:()=>V.profil(a),u:()=>V.u(a),oner:()=>V.oner(),aktar:()=>V.aktar(),yonetim:()=>V.yonetim(a)};
  chrome();
  (map[r]||V.nf)();
  if(r==='gorevler'){
    const section=new URLSearchParams(arg).get('section');
    if(['d','w','l'].includes(section))requestAnimationFrame(()=>document.getElementById('tk-'+section)?.scrollIntoView({block:'start',behavior:'instant'}));
  }
  setHdark();
  if(!(document.activeElement&&document.activeElement.id==='sq'))app.focus({preventScroll:true});
}
window.addEventListener('hashchange',route);
window.addEventListener('scroll',setHdark,{passive:true});
document.addEventListener('submit',e=>{if(e.target&&e.target.id==='hs'){e.preventDefault();const v=$('#hsq').value.trim();go('#/kesfet'+(v?'?q='+encodeURIComponent(v):''))}});
window.addEventListener('resize',()=>{const tl=$('#tlogin');if(tl)tl.style.display=innerWidth>=900?'inline-flex':'none'});
load();applyTheme();initMagneticButtons();
if(DB.me&&!DB.users[DB.me])DB.me=null;
route();
</script>
