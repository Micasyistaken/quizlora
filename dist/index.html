<style>
:root{--pu:#8B5CF6;--pu2:#6D3EEB;--sun:#F6C453;--mint:#5CE0BE;--ink:#09090C;--bg:#09090C;--card:#121218;--soft:#1A1A23;--txt:#F7F7FB;--mut:#A4A4B2;--line:#292936;--red:#F06A73;--lnk:#B99AFF;--sh:0 20px 56px rgba(0,0,0,.34);--r:18px;--blob:#20173A;--surface:#121218;--surface-elevated:#191922;--surface-hover:#20202B;--border-subtle:#292936;--foreground:#F7F7FB;--foreground-muted:#A4A4B2;--accent:#8B5CF6;--accent-glow:rgba(139,92,246,.32);--radius-card:18px;--radius-shell:24px;--shadow-card:0 16px 42px rgba(0,0,0,.28);--shadow-elevated:0 24px 68px rgba(0,0,0,.42);color-scheme:dark;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
 :root[data-theme="light"]{--pu:#7652ED;--pu2:#5F39D8;--sun:#D79012;--mint:#159B79;--ink:#19172F;--bg:#F4F3F8;--card:#FFFFFF;--soft:#ECEAF4;--txt:#1B1A22;--mut:#676574;--line:#DEDBE8;--red:#D84651;--lnk:#6542D4;--sh:0 16px 42px rgba(36,28,71,.12);--blob:#E9E2FF;--surface:#FFFFFF;--surface-elevated:#FFFFFF;--surface-hover:#F4F1FB;--border-subtle:#DEDBE8;--foreground:#1B1A22;--foreground-muted:#676574;--accent:#7652ED;--accent-glow:rgba(118,82,237,.2);--radius-card:18px;--radius-shell:24px;--shadow-card:0 14px 36px rgba(36,28,71,.1);--shadow-elevated:0 22px 56px rgba(36,28,71,.16);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09090C;--card:#121218;--soft:#1A1A23;--txt:#F7F7FB;--mut:#A4A4B2;--line:#292936;--lnk:#B99AFF;--sh:0 20px 56px rgba(0,0,0,.34);--blob:#20173A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#09090C;--card:#121218;--soft:#1A1A23;--txt:#F7F7FB;--mut:#A4A4B2;--line:#292936;--lnk:#B99AFF;--sh:0 20px 56px rgba(0,0,0,.34);--blob:#20173A;--surface:#121218;--surface-elevated:#191922;--surface-hover:#20202B;--border-subtle:#292936;--foreground:#F7F7FB;--foreground-muted:#A4A4B2;--accent:#8B5CF6;--accent-glow:rgba(139,92,246,.32);--shadow-card:0 16px 42px rgba(0,0,0,.28);--shadow-elevated:0 24px 68px rgba(0,0,0,.42);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:16px/1.5 "Segoe UI",Inter,system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;right:-160px;top:-180px;width:460px;height:460px;border-radius:50%;background:var(--blob);z-index:-1}
h1,h2,h3{font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 .4em}
h1{font-size:clamp(2rem,6vw,3.2rem)}h2{font-size:1.45rem}h3{font-size:1.1rem}
a{color:var(--lnk)}
p{margin:0 0 .8em}
.mut{color:var(--mut)}.sm{font-size:.88rem}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--lnk);margin:0 0 .6em}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
main{padding:18px 0 24px;min-height:70vh}
/* üst çubuk */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}

.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--txt);font-weight:800;font-size:1.35rem;letter-spacing:-.03em}
.brand svg{width:38px;height:38px}
.dnav{display:none;gap:2px;margin-left:12px;flex:1}
.dnav a{padding:9px 13px;border-radius:12px;color:var(--mut);text-decoration:none;font-weight:700;font-size:.95rem}
.dnav a:hover{background:var(--soft)}.dnav a.on{background:var(--soft);color:var(--lnk)}
.tright{margin-left:auto;display:flex;align-items:center;gap:8px}
.ibtn{width:44px;height:44px;border-radius:14px;border:0;background:var(--soft);color:var(--txt);font-size:1.15rem;cursor:pointer;display:grid;place-items:center;text-decoration:none}
.chipc{display:inline-flex;align-items:center;gap:6px;background:var(--soft);padding:8px 12px;border-radius:999px;font-weight:800;font-size:.92rem;text-decoration:none;color:var(--txt)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;text-decoration:none;color:var(--mut);font-size:.72rem;font-weight:700;min-height:52px;justify-content:center}
.bnav a b{font-size:1.3rem;line-height:1}
.bnav a.on{color:var(--lnk);background:var(--soft)}
@media(min-width:900px){.dnav{display:flex}.bnav{display:none}.mob-only{display:none!important}}
/* bileşenler */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px;border:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.sec{margin-top:34px}
.sec>.row{margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:2px solid transparent;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;background:var(--soft);color:var(--txt)}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--pu);color:#fff;box-shadow:0 8px 18px rgba(92,80,241,.3)}
.btn.sun{background:var(--sun);color:var(--ink)}
.btn.mint{background:var(--mint);color:var(--ink)}
.btn.out{background:transparent;border-color:var(--line)}
.btn.sm{min-height:38px;padding:0 14px;font-size:.88rem;border-radius:11px}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
.sech{font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--lnk);margin:0}
.hero{padding:26px 0 8px}
.herogrid{display:grid;gap:22px;align-items:center}
@media(min-width:900px){.herogrid{grid-template-columns:1.2fr 1fr}}
.brandcards{display:grid;gap:14px}
.bw{display:flex;align-items:center;gap:18px;min-height:150px}
.wm{font-size:clamp(2.2rem,7vw,3rem);font-weight:800;letter-spacing:-.05em;line-height:1}
.tg{color:var(--mut);margin-top:8px}
.bd{background:#19172F;display:grid;place-items:center;min-height:160px}
@media(max-width:699px){.bd{display:none}}
/* Magic UI inspired motion patterns (MIT): github.com/magicuidesign/magicui */

.magic-announcement::before{content:"";position:absolute;inset:0;padding:1px;border-radius:inherit;background:linear-gradient(90deg,#ffb548,#9c40ff,#36cfa8,#ffb548);background-size:300% 100%;animation:magic-gradient 6s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}.magic-announcement span{color:var(--lnk);font-size:1.05rem}
.aurora-text{background:linear-gradient(90deg,var(--pu),#9c40ff,var(--mint),var(--pu));background-size:300% 100%;background-clip:text;-webkit-background-clip:text;color:transparent;animation:magic-gradient 7s linear infinite}
.magic-shimmer{position:relative;isolation:isolate;overflow:hidden}.magic-shimmer::after{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.58) 44%,transparent 60%);transform:translateX(-130%);animation:magic-shimmer 3.8s ease-in-out infinite}
.magic-showcase{position:relative;display:grid;place-items:center;min-height:300px;overflow:hidden;border-radius:28px;background:radial-gradient(circle at 50% 42%,#383071,#17142f 68%);box-shadow:0 20px 50px rgba(25,23,47,.25)}
.magic-showcase::before{content:"";position:absolute;width:155%;aspect-ratio:1;border:1px dashed rgba(255,255,255,.2);border-radius:50%;animation:magic-spin 18s linear infinite}.magic-showcase::after{content:"";position:absolute;width:74%;aspect-ratio:1;border:1px dashed rgba(255,255,255,.15);border-radius:50%;animation:magic-spin 12s linear infinite reverse}
.magic-core{position:relative;z-index:2;display:grid;place-items:center;width:118px;height:118px;border-radius:34px;background:linear-gradient(145deg,#746aff,#4a3fe0);box-shadow:0 0 0 9px rgba(255,255,255,.08),0 18px 42px rgba(73,62,224,.55)}.magic-core svg{width:72px;height:72px}
.magic-orbit{position:absolute;z-index:3;display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.95);box-shadow:0 10px 24px rgba(0,0,0,.22);font-size:1.35rem}.magic-orbit.one{top:44px;left:20%}.magic-orbit.two{right:14%;top:42%}.magic-orbit.three{bottom:32px;left:28%}
.magic-stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.magic-stat{padding:12px 8px;border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--card) 83%,transparent);text-align:center}.magic-stat b{display:block;font-size:1.12rem;font-variant-numeric:tabular-nums}.magic-stat small{color:var(--mut);font-size:.72rem;font-weight:700}
.magic-marquee{position:relative;overflow:hidden;margin-top:24px;padding:1px 0;mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}.magic-marquee-track{display:flex;width:max-content;gap:9px;animation:magic-marquee 26s linear infinite}.magic-marquee:hover .magic-marquee-track{animation-play-state:paused}.magic-marquee-item{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--card) 88%,transparent);color:var(--txt);font-size:.84rem;font-weight:800;white-space:nowrap;text-decoration:none}
@keyframes magic-gradient{to{background-position:300% 0}}@keyframes magic-shimmer{45%,100%{transform:translateX(130%)}}@keyframes magic-float{50%{transform:translate(-25px,28px) scale(1.08)}}@keyframes magic-spin{to{transform:rotate(360deg)}}@keyframes magic-marquee{to{transform:translateX(-50%)}}
@media(max-width:699px){.magic-hero{padding:24px 18px}.magic-showcase{min-height:230px}.magic-stat-row{margin-top:0}.magic-orbit.one{top:27px}.magic-orbit.three{bottom:22px}}
.catalog-hero{position:relative;overflow:hidden;padding:28px;border:1px solid color-mix(in srgb,var(--pu) 24%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--soft) 78%,var(--card)),var(--card));border-radius:var(--r);box-shadow:var(--sh)}.catalog-hero::after{content:"✦";position:absolute;right:28px;top:-22px;color:color-mix(in srgb,var(--pu) 18%,transparent);font-size:10rem;line-height:1;transform:rotate(18deg);pointer-events:none}.catalog-hero h1,.catalog-hero p,.catalog-hero .row{position:relative;z-index:1}
.catalog-tools{display:grid;grid-template-columns:minmax(180px,1fr) auto auto;gap:10px;margin-top:18px}.catalog-tools input{min-height:48px}.catalog-filter{display:flex;gap:7px;overflow:auto;margin:16px 0 18px;padding-bottom:4px}.catalog-filter button{flex:none;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:var(--card);color:var(--mut);font:inherit;font-size:.84rem;font-weight:800;cursor:pointer}.catalog-filter button.on{background:var(--pu);border-color:var(--pu);color:#fff}
.catalog-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;color:var(--mut);font-size:.9rem}.catalog-summary b{color:var(--txt)}.catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:13px}.catalog-card{position:relative;display:flex;flex-direction:column;min-height:234px;padding:16px;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 8px 20px rgba(92,80,241,.06);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}.catalog-card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--pu) 45%,var(--line));box-shadow:0 14px 30px rgba(92,80,241,.14)}.catalog-card.selected{border-color:var(--mint);box-shadow:0 0 0 2px color-mix(in srgb,var(--mint) 45%,transparent),0 14px 30px rgba(54,207,168,.12)}
.catalog-preview{position:relative;display:grid;place-items:center;height:76px;margin:-16px -16px 14px;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--soft) 92%,var(--card)),var(--card));color:var(--pu)}.catalog-preview::before,.catalog-preview::after{content:"";position:absolute;border:1px solid color-mix(in srgb,var(--pu) 30%,transparent);border-radius:99px}.catalog-preview::before{width:130px;height:130px}.catalog-preview::after{width:78px;height:78px;border-color:color-mix(in srgb,var(--mint) 55%,transparent)}.catalog-preview span{position:relative;z-index:1;display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--pu);color:#fff;font-size:1.15rem;box-shadow:0 8px 18px rgba(92,80,241,.3)}.catalog-card[data-kind="Metin"] .catalog-preview{background:linear-gradient(100deg,#ffb548,#9c40ff,#36cfa8);background-size:200% 100%;animation:magic-gradient 5s linear infinite}.catalog-card[data-kind="Metin"] .catalog-preview::before,.catalog-card[data-kind="Metin"] .catalog-preview::after{display:none}.catalog-card[data-kind="Metin"] .catalog-preview span{width:auto;height:auto;background:transparent;box-shadow:none;font-size:1.4rem;font-weight:900;letter-spacing:-.06em}.catalog-card[data-kind="Buton"] .catalog-preview span{width:116px;border-radius:999px;font-size:.82rem;font-weight:800}.catalog-card[data-kind="Arka plan"] .catalog-preview{background-size:24px 24px;background-image:linear-gradient(color-mix(in srgb,var(--pu) 18%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--pu) 18%,transparent) 1px,transparent 1px)}.catalog-card[data-kind="Arka plan"] .catalog-preview::before{border-style:dashed;animation:magic-spin 12s linear infinite}.catalog-card[data-kind="Kart ve düzen"] .catalog-preview span{transform:rotate(-7deg)}
.catalog-title{font-size:1rem;margin:0 0 5px}.catalog-description{min-height:2.9em;margin:0;color:var(--mut);font-size:.82rem;line-height:1.45}.catalog-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.catalog-meta span{padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--mut);font-size:.7rem;font-weight:800}.catalog-meta .friendly{background:color-mix(in srgb,var(--mint) 22%,var(--card));color:var(--txt)}.catalog-actions{display:flex;gap:8px;margin-top:auto;padding-top:13px}.catalog-actions .btn{flex:1}.catalog-actions a{display:grid;place-items:center;width:42px;min-height:38px;padding:0;border:1px solid var(--line);border-radius:11px;color:var(--lnk);text-decoration:none;font-size:1.1rem}.catalog-empty{padding:40px 16px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--mut)}.catalog-selection{position:sticky;bottom:14px;z-index:20;display:none;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--mint) 55%,var(--line));border-radius:16px;background:color-mix(in srgb,var(--card) 92%,transparent);box-shadow:0 12px 32px rgba(25,23,47,.18);backdrop-filter:blur(12px)}.catalog-selection.show{display:flex}.catalog-selection p{margin:0;font-size:.88rem}.catalog-selection b{display:block}.catalog-selection .row{justify-content:flex-end}

.foot{padding-top:6px;padding-bottom:110px;color:var(--mut);font-size:.92rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(min-width:900px){.foot{padding-bottom:40px}}
.lead{font-size:1.15rem;color:var(--mut);max-width:34em}

.home-layout{display:grid;grid-template-columns:minmax(214px,250px) minmax(0,1fr);gap:24px;align-items:start}

  const cats=[];let n=0;

  const mains=cats.filter(c=>!c.p);
  const find=(m,s)=>{const M=mains.find(c=>c.n===m);return cats.find(c=>c.p===M.id&&c.n===s)};

function optsHtml(q,S,c){
  const i=S.i,typed=c.typed;
  if(typed){const v=c.back?(S.ans[i]||''):'';return `<input id="typed" type="text" autocomplete="off" placeholder="Cevabını yaz" aria-label="Cevabın" value="${esc(v)}" ${S.fb?'disabled':''}>`}
  return `<div class="opts" role="group" aria-label="Cevap seçenekleri">${q.o.map((o,k)=>{
    let cls='';
    if(S.fb){cls=k===q.a?'good':(k===S.ans[i]?'bad':'')}
    else if(c.back?S.ans[i]===k:S.sel===k)cls='sel';
    return `<button class="opt ${cls}" data-a="pick" data-v="${k}" ${S.fb?'disabled':''}><i>${LET[k]}</i>${esc(o)}</button>`}).join('')}</div>`;
}
function testProgress({current,total,blank=0}){
  const finite=Number.isFinite(total)&&total>0,safeTotal=finite?Math.max(1,total):null,safeCurrent=finite?Math.min(Math.max(1,current),safeTotal):Math.max(1,current),fill=finite?safeCurrent/safeTotal*100:null,label=finite?`${safeCurrent}/${safeTotal}`:`${safeCurrent}/∞`;
  const aria=finite?`aria-valuemin="1" aria-valuemax="${safeTotal}" aria-valuenow="${safeCurrent}"`:'';
  return `<section class="test-progress${finite?'':' is-open'}" aria-label="Test ilerlemesi"><div class="test-progress-meta"><span class="test-progress-count">Soru <b>${label}</b></span><span class="test-progress-blank">Boş: ${blank}</span></div><div class="test-progress-track" role="progressbar" aria-label="Soru ilerlemesi" ${aria} aria-valuetext="Soru ${label}; ${blank} soru boş bırakıldı"><i class="test-progress-fill"${finite?` style="--test-progress:${fill}%"`:''}></i></div></section>`;
}
function play(c){
  const n=c.qs.length;
  const S={i:0,ans:Array(n).fill(null),skipped:Array(n).fill(false),sel:null,fb:false,end:c.limit?Date.now()+c.limit*1000:0,done:false,failed:false,t:0};
  if(c.resume){S.i=Math.min(c.resume.i,n-1);S.ans=c.resume.ans.slice();}
  const isOk=k=>{const a=S.ans[k],q=c.qs[k];if(a==null||a==='')return false;return c.typed?norm(a)===norm(q.o[q.a]):a===q.a};
  function end(reason){
    if(S.done)return;S.done=true;clearInterval(S.t);CUR=null;
    c.onEnd({ans:S.ans,ok:c.qs.map((_,k)=>isOk(k)),reason});
  }
  function draw(){
    const q=c.qs[S.i];if(c.onShow&&!S.fb)c.onShow(q);
    const last=S.i===n-1;
    let h=`<div class="run"><div class="qhead"><div><b>${esc(c.title)}</b></div>${S.end?'<div class="clock" id="clk" role="timer"></div>':''}</div>
     ${testProgress({current:S.i+1,total:n,blank:S.skipped.filter(Boolean).length})}
     <div class="card"><h2 class="qt">${esc(q.q)}</h2>${optsHtml(q,S,c)}`;
    if(S.fb){h+=`<div class="fb" role="status"><b>${S.failed?'Yanlış cevap':(isOk(S.i)?'Doğru!':'Yanlış cevap')}</b><br>Doğru cevap: ${esc(q.o[q.a])}<br><span class="mut">${esc(q.e)}</span></div>`}
    h+='<div class="acts">';
    if(c.back){
      h+=`${S.i>0?'<button class="btn out" data-a="prev">Önceki</button>':''}<button class="btn out" data-a="skip">Pas</button><span class="grow"></span>${last?'<button class="btn pri" data-a="fin">Sınavı bitir</button>':'<button class="btn pri" data-a="next">Sonraki</button>'}`;
    }else if(S.fb){
      h+=`<button class="btn pri grow" data-a="next">${S.failed?'Devam':(last?'Bitir':'Sonraki soru')}</button>`;
    }else{
      h+=`<button class="btn pri grow" data-a="send" ${(c.typed?false:S.sel==null)?'disabled':''} id="sendb">Cevabı gönder</button>`;
    }
    h+='</div></div>';
    if(c.back){h+=`<div class="dots" aria-label="Soru gezgini">${c.qs.map((_,k)=>`<button data-a="go" data-v="${k}" class="${k===S.i?'cur':(S.ans[k]!=null&&S.ans[k]!==''?'done':'')}" aria-label="Soru ${k+1}">${k+1}</button>`).join('')}</div>`}
    h+='</div>';
    setApp(h);
    if(c.typed){const inp=$('#typed');if(inp){inp.addEventListener('input',()=>{if(c.back){S.ans[S.i]=inp.value;if(inp.value.trim())S.skipped[S.i]=false}else S.sel=inp.value});inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!c.back)CUR.send()});if(!S.fb)inp.focus()}}
    tick();
  }
  function tick(){
    const el=$('#clk');if(!el||!S.end)return;
    const s=(S.end-Date.now())/1000;el.textContent='⏱ '+fmtT(s);el.classList.toggle('low',s<30);
    if(s<=0)end('time');
  }
  const markSkipped=()=>{if(c.back&&(S.ans[S.i]==null||S.ans[S.i]===''))S.skipped[S.i]=true};
  function adv(){if(S.i>=n-1)end('done');else{S.i++;S.sel=null;S.fb=false;draw()}}
  CUR={
    abort(){clearInterval(S.t);if(!S.done&&c.onAbort)c.onAbort(S)},
    pick(k){if(S.fb)return;if(c.back){S.ans[S.i]=k;S.skipped[S.i]=false}else S.sel=k;draw()},
    send(){
      if(S.fb)return;const v=S.sel;if(v==null||v==='')return;
      S.ans[S.i]=v;const ok=isOk(S.i);
      if(c.onProgress)c.onProgress(S);
      if(c.instant){
        S.fb=true;S.failed=!!(c.failFast&&!ok);
        if(ok){const fx=eqItem(U(),'fx');if(fx)pulse(fx.d.e)}
        draw();
      }else adv();
    },
    next(){if(c.back){markSkipped();if(S.i<n-1){S.i++;draw()}}else if(S.failed)end('wrong');else adv()},
    prev(){if(S.i>0){markSkipped();S.i--;draw()}},
    skip(){S.ans[S.i]=null;S.skipped[S.i]=true;if(S.i<n-1){S.i++;draw()}else draw()},
    go(k){if(k!==S.i)markSkipped();S.i=k;draw()},
    fin(){const blank=S.ans.filter(a=>a==null||a==='').length;if(blank){confirmBox('Sınavı bitir',blank+' soru boş kaldı. Bitirmek istiyor musun?','Evet, bitir',()=>end('done'))}else end('done')}
  };
  if(S.end)S.t=setInterval(tick,500);
  draw();
}
function pulse(e){const p=document.createElement('div');p.className='pop';p.textContent=e;document.body.appendChild(p);setTimeout(()=>p.remove(),1000)}
A.pick=t=>CUR&&CUR.pick(+t.dataset.v);A.send=()=>CUR&&CUR.send();A.next=()=>CUR&&CUR.next();A.prev=()=>CUR&&CUR.prev();
A.skip=()=>CUR&&CUR.skip();A.go=t=>CUR&&CUR.go(+t.dataset.v);A.fin=()=>CUR&&CUR.fin();

V.sonsuz=id=>{
  if(!id){
    setApp(`<div class="form card"><p class="eyebrow">Sonsuz test</p><h1>Konunu seç</h1><p class="mut">Ortak soru havuzundan art arda soru gelir. Zorluk performansına göre ayarlanır. Aynı soru sık gelmez.</p><label for="tp">Konu</label>${topicSelect('tp')}<div style="margin-top:16px"><button class="btn pri" id="go">Başla</button></div></div>`);
    $('#go').onclick=()=>go('#/sonsuz/'+$('#tp').value);return;
  }
  const pool=poolOf(id);if(!pool.length)return V.nf();
  const title=id==='mix'?'Genel Kültür karma':(cat(id)?cat(id).n:'Sonsuz test');
  const u=U(),store=u||G;store.seen=store.seen||{};
  const S={n:0,c:0,recent:[],diff:u?(u.skill<950?1:u.skill<1100?2:3):2,by:{},cur:null,fb:false,sel:null,earned:0};
  CUR={abort(){}};
  function pick(){
    const seen=store.seen;
    let cand=pool.filter(q=>!seen[q.id]&&q.d===S.diff);
    if(!cand.length)cand=pool.filter(q=>!seen[q.id]).sort((a,b)=>Math.abs(a.d-S.diff)-Math.abs(b.d-S.diff)).filter((q,_,a)=>Math.abs(q.d-S.diff)===Math.abs(a[0].d-S.diff));
    if(!cand.length)cand=[...pool].sort((a,b)=>(seen[a.id]||0)-(seen[b.id]||0)).slice(0,5);
    return rnd(cand);
  }
  function draw(){
    const q=S.cur;
    setApp(`<div class="run"><div class="qhead"><div><b>${esc(title)}</b><br><span class="mut sm">${S.n} çözüldü · ${S.c} doğru</span></div><span class="tag">Zorluk: ${['','Kolay','Orta','Zor'][S.diff]}</span></div>
     ${testProgress({current:S.n+(S.fb?0:1),total:null,blank:0})}
     <div class="card"><h2 class="qt">${esc(q.q)}</h2><div class="opts">${q.o.map((o,k)=>`<button class="opt ${S.fb?(k===q.a?'good':(k===S.sel?'bad':'')):(k===S.sel?'sel':'')}" data-a="ipick" data-v="${k}" ${S.fb?'disabled':''}><i>${LET[k]}</i>${esc(o)}</button>`).join('')}</div>
     ${S.fb?`<div class="fb" role="status"><b>${S.sel===q.a?'Doğru!':'Yanlış cevap'}</b><br>Doğru cevap: ${esc(q.o[q.a])}<br><span class="mut">${esc(q.e)}</span><br>${S.note?`<span class="tag ok">${S.note}</span>`:''}</div>`:''}
     <div class="acts">${S.fb?'<button class="btn pri grow" data-a="inext">Sonraki soru</button>':'<button class="btn pri grow" data-a="isend" '+(S.sel==null?'disabled':'')+'>Cevabı gönder</button>'}<button class="btn out" data-a="ifin">Oturumu bitir</button></div></div></div>`);
  }
  function nextQ(){S.cur=pick();S.sel=null;S.fb=false;S.note='';draw()}
  CUR={
    abort(){},
    ipick(k){if(!S.fb){S.sel=k;draw()}},
    isend(){
      if(S.fb||S.sel==null)return;const q=S.cur,ok=S.sel===q.a;
      S.fb=true;S.n++;if(ok)S.c++;
      store.seen[q.id]=Date.now();
      const m=mainOf(q.cat);S.by[m.id]=S.by[m.id]||{a:0,c:0};S.by[m.id].a++;if(ok)S.by[m.id].c++;
      S.recent.push(ok);S.recent=S.recent.slice(-5);
      if(S.recent.length===5){const r=S.recent.filter(Boolean).length;if(r>=4){S.diff=Math.min(3,S.diff+1);S.recent=[]}else if(r<=1){S.diff=Math.max(1,S.diff-1);S.recent=[]}}
      if(u){rec(q,ok);if(ok&&!u.credited[q.id]){u.credited[q.id]=1;u.credits+=1;S.earned++;S.note='🪙 +1 kredi (ilk doğru)'}else if(ok)S.note='Bu soruyu daha önce doğru çözdün: kredi yok';bump('inf');save();chrome()}
      if(ok){const fx=eqItem(u,'fx');if(fx)pulse(fx.d.e)}
      draw();
    },
    inext(){nextQ()},
    ifin(){
      CUR=null;if(u){checkBadges()}
      const rows=Object.entries(S.by).map(([k,v])=>`<tr><td>${esc(cat(k).n)}</td><td>${v.c}/${v.a}</td><td>%${Math.round(v.c/v.a*100)}</td></tr>`).join('');
      setApp(`<div class="run"><div class="card" style="text-align:center"><p class="eyebrow">Oturum özeti</p><h1>${esc(title)}</h1>${S.n?scoreRing(S.c,S.n):'<p class="mut">Hiç soru çözmedin.</p>'}<p class="mut">Çözülen soru: ${S.n} · Kazanılan kredi: ${u?S.earned:'hesapla kazanılır'}</p>
       ${rows?`<div class="tw"><table><tr><th>Konu</th><th>Doğru</th><th>Oran</th></tr>${rows}</table></div>`:''}
       <div class="row" style="justify-content:center;margin-top:14px"><a class="btn pri" href="#/sonsuz/${id}">Yeni oturum</a><a class="btn out" href="#/modlar">Modlar</a></div></div></div>`);
    }
  };
  nextQ();
};

A.jstart=()=>{
  const u=U();if(!u)return;const j=u.j,L=j.level;

  const grp=shuffle(groupOf(L)),qs=[],need=L<=3?1:L<=8?2:3;
  for(const mid of grp){
    const pool=poolFor(mid).filter(q=>!j.seen[q.id]);
    if(!pool.length)return toast('“'+cat(mid).n+'” alanında yeni soru kalmadı. Yönetici soru ekleyince devam edebilirsin.');
    const best=pool.sort((a,b)=>Math.abs(a.d-need)-Math.abs(b.d-need));
    const top=best.filter(q=>Math.abs(q.d-need)===Math.abs(best[0].d-need));
    qs.push(rnd(top));
  }
  j.active=true;save();
  const timed=j.stone===5,stoneNo=j.stone;
  play({qs,title:`Seviye ${L} · Taş ${stoneNo}`,instant:true,failFast:true,limit:timed?stoneTime(L):0,
    onShow:q=>{u.j.seen[q.id]=1;save()},
    onAbort:()=>{if(U()&&U().j.active){journeyFail(U())}},
    onEnd:res=>{
      const pass=res.ok.every(Boolean)&&res.ok.length===5;
      u.j.active=false;
      if(pass){
        bump('stone');
        if(stoneNo===5){u.j.level++;u.j.stone=1}else u.j.stone++;
        act(u,`Yolculuk: Seviye ${L} taş ${stoneNo} geçildi`);checkBadges();save();
        setApp(`<div class="run"><div class="card" style="text-align:center"><p class="eyebrow">Taş geçildi</p><h1>${stoneNo===5?'Seviye '+L+' tamamlandı!':'Harika!'}</h1><p class="mut">${stoneNo===5?'Seviye '+(L+1)+' seni bekliyor.':'Sıradaki taş açıldı.'}</p><a class="btn pri" href="#/yolculuk">Yol haritası</a></div></div>`);
      }else{
        journeyFail(u);
        setApp(`<div class="run"><div class="card" style="text-align:center"><p class="eyebrow">${res.reason==='time'?'Süre doldu':'Deneme bitti'}</p><h1>Bu taşta kaldın</h1><p class="mut">Geçtiğin taşlar durur. Aynı taşı ${DB.s.cool/60} saat sonra yeniden deneyebilirsin; yeni denemede 5 soru da değişir.</p><a class="btn pri" href="#/yolculuk">Yol haritası</a></div></div>`);
      }
    }});
};

A.duel=t=>duelRun(t.dataset.m||'friend');
function duelRun(mode){
  const u=U();if(!u)return go('#/giris');
  const names=['Bilim','Genel Kültür','Tarih','Spor','Coğrafya'];
  const qs=names.map(nm=>{const m=MAINS().find(c=>c.n===nm);return rnd(poolFor(m.id))});
  const D={r:0,me:0,op:0,tm:0,to:0,ans:null,opA:null,phase:'wait',ms:0,start:0,opMs:0};
  const sec=DB.s.duelSec;
  const intro=eqItem(u,'intro');
  setApp(`<div class="card" style="text-align:center;max-width:520px;margin:30px auto"><div class="spinner"></div><h2 style="margin-top:18px">Rakip aranıyor…</h2><p class="mut">Beceri puanın: ${u.skill}</p><button class="btn out" data-a="dquit">Vazgeç</button></div>`);
  CUR={abort(){}, dquit(){go('#/duello')}};
  later(()=>{
    if(!CUR)return;
    setApp(`<div class="card" style="max-width:560px;margin:30px auto"><div class="vs"><div>${avatar(u,64)}<br><b>${nameHtml(u)}</b></div><b class="${intro?intro.d.k:''}" style="font-size:2rem">VS</b><div><span class="av" style="width:64px;height:64px;font-size:30px">🤖</span><br><b>Demo Rakip</b></div></div><p class="mut" style="text-align:center;margin-top:14px">${mode==='ranked'?'Sıralamalı':'Özel'} demo maç · kredi ve puan etkilenmez</p></div>`);
    later(round,1800);
  },1800);
  function round(){
    if(!CUR)return;D.phase='ans';D.ans=null;D.start=Date.now();D.end=D.start+sec*1000;
    const q=qs[D.r],opOk=Math.random()<.6,opDelay=2000+Math.random()*(sec*600);
    D.opA=opOk?q.a:rnd([0,1,2,3].filter(x=>x!==q.a));D.opAt=D.start+opDelay;
    drawQ();
  }
  function drawQ(){
    const q=qs[D.r];
    setApp(`<div class="run"><div class="qhead"><div><b>Tur ${D.r+1} / 5 · ${names[D.r]}</b><br><span class="mut sm">Sen ${D.me} · Rakip ${D.op}</span></div><div class="clock" id="clk" role="timer"></div></div><div class="bar"><i style="width:${D.r/5*100}%"></i></div>
     <div class="card"><h2 class="qt">${esc(q.q)}</h2><div class="opts">${q.o.map((o,k)=>`<button class="opt ${D.ans===k?'sel':''}" data-a="dpick" data-v="${k}" ${D.ans!=null?'disabled':''}><i>${LET[k]}</i>${esc(o)}</button>`).join('')}</div>
     <p class="mut sm" style="margin-top:12px">${D.ans!=null?'Cevabın gönderildi. Rakibi bekliyorsun…':'Rakibin cevabı tur bitene kadar görünmez.'}</p><div class="acts"><button class="btn out sm" data-a="dquit2">Bağlantıyı kopar (demo)</button></div></div></div>`);
    tickD();
  }
  function tickD(){
    const el=$('#clk');if(el){const s=(D.end-Date.now())/1000;el.textContent='⏱ '+fmtT(s);el.classList.toggle('low',s<5)}
    if(D.phase!=='ans')return;
    const opDone=Date.now()>=D.opAt;
    if((D.ans!=null&&opDone)||Date.now()>=D.end)reveal();
  }
  every(tickD,300);
  function reveal(){
    if(D.phase!=='ans')return;D.phase='rev';
    const q=qs[D.r],now=Date.now();
    const myOk=D.ans===q.a,opOk=D.opA===q.a;
    if(myOk)D.me++;if(opOk)D.op++;
    D.tm+=D.ans!=null?D.ms:sec*1000;D.to+=Math.min(D.opAt,D.end)-D.start;
    const last=D.r===4;
    setApp(`<div class="run"><div class="qhead"><b>Tur ${D.r+1} sonucu</b><span class="tag">Skor ${D.me*10} – ${D.op*10}</span></div><div class="card"><h2 class="qt">${esc(q.q)}</h2>
     <div class="opts">${q.o.map((o,k)=>`<div class="opt ${k===q.a?'good':(k===D.ans||k===D.opA?'bad':'')}"><i>${LET[k]}</i><span style="flex:1">${esc(o)}</span><span class="tag">${k===D.ans?'Sen ':''}${k===D.opA?'Rakip':''}</span></div>`).join('')}</div>
     <p style="margin-top:12px">Sen: ${D.ans==null?'Süre doldu':(myOk?'Doğru':'Yanlış')} · Rakip: ${opOk?'Doğru':'Yanlış'}</p><p class="mut">${esc(q.e)}</p>
     <div class="acts"><button class="btn pri grow" data-a="dnext">${last?'Maçı bitir':'Sonraki tur'}</button></div></div></div>`);
  }
  CUR.dpick=k=>{if(D.phase!=='ans'||D.ans!=null)return;D.ans=k;D.ms=Date.now()-D.start;drawQ()};
  CUR.dnext=()=>{if(D.r>=4)finish('done');else{D.r++;round()}};
  CUR.dquit2=()=>finish('drop');
  function finish(why){
    CUR=null;u.duels++;bump('duel');act(u,'Düello oynadı (demo)');checkBadges();save();
    const win=D.me>D.op||(D.me===D.op&&D.tm<D.to),draw=D.me===D.op&&D.tm===D.to;
    setApp(`<div class="run"><div class="card" style="text-align:center"><p class="eyebrow">${why==='drop'?'Bağlantı koptu · maç bitti':'Maç bitti'}</p><h1>${why==='drop'?'Maç yarıda kaldı':(draw?'Berabere':win?'Kazandın!':'Rakip kazandı')}</h1>
     <div class="score">${D.me*10} – ${D.op*10}</div><p class="mut">Toplam süre: ${(D.tm/1000).toFixed(1)} sn – ${(D.to/1000).toFixed(1)} sn</p>
     <p class="tag">Demo maç: kredi ve beceri puanı değişmedi</p><div class="row" style="justify-content:center;margin-top:12px"><a class="btn pri" href="#/duello">Düelloya dön</a></div></div></div>`);
  }
}
A.dquit=()=>CUR&&CUR.dquit&&CUR.dquit();A.dpick=t=>CUR&&CUR.dpick&&CUR.dpick(+t.dataset.v);A.dnext=()=>CUR&&CUR.dnext&&CUR.dnext();A.dquit2=()=>CUR&&CUR.dquit2&&CUR.dquit2();

function board(t0,t1,cid){
  const rows=[];
  Object.values(DB.users).forEach(u=>{

  });

}

A.magictoggle=el=>{const id=el.dataset.magic;magicSelection=magicSelection.includes(id)?magicSelection.filter(x=>x!==id):[...magicSelection,id];sessionStorage.setItem('qz_magic_selection',JSON.stringify(magicSelection));renderMagicCatalog()};
A.magicclear=()=>{magicSelection=[];sessionStorage.removeItem('qz_magic_selection');renderMagicCatalog()};
A.magiccopy=()=>{const chosen=MAGIC_COMPONENTS.filter(x=>magicSelection.includes(x.id));copyMagic('Magic UI katalog seçimlerim: '+chosen.map(x=>x.id).join(', ')+'. Bu bileşenleri Quizlora’ya uygun, tutarlı bir akışla ekle; yerleşimi sen öner.')};
A.magicfilter=el=>{magicFilter=el.dataset.filter;document.querySelectorAll('[data-a="magicfilter"]').forEach(b=>{const on=b===el;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on))});renderMagicCatalog()};
A.magicrefresh=async()=>{try{const r=await fetch('https://raw.githubusercontent.com/magicuidesign/magicui/main/registry.json',{cache:'no-store'});if(!r.ok)throw new Error();const data=await r.json();const items=data.items.filter(x=>x.type==='registry:ui').map(x=>({id:x.name,title:x.title||x.name.replace(/(^|-)([a-z])/g,(_,p,c)=>' '+c.toUpperCase()).trim(),description:x.description||'Magic UI component.'}));if(!items.length)throw new Error();MAGIC_COMPONENTS=items;magicSelection=magicSelection.filter(id=>items.some(x=>x.id===id));sessionStorage.setItem('qz_magic_selection',JSON.stringify(magicSelection));$('#magiccount').textContent=items.length;renderMagicCatalog();toast(items.length+' bileşen GitHub’dan yenilendi.')}catch(e){toast('GitHub kataloğu yenilenemedi; yerleşik liste gösteriliyor.')}};
V.nf=()=>setApp(`<div class="card empty"><h2>Sayfa bulunamadı</h2><a class="btn pri" href="#/">Ana sayfaya dön</a></div>`);

/* ================= yönlendirici ================= */
function route(){
  if(CUR&&CUR.abort){try{CUR.abort()}catch(e){}}CUR=null;
  TIMERS.forEach(t=>{clearInterval(t);clearTimeout(t)});TIMERS=[];
  closeModal();
  let h=(location.hash||'#/').slice(1);let arg='';
  const qi=h.indexOf('?');if(qi>=0){arg=h.slice(qi+1);h=h.slice(0,qi)}
  const p=h.split('/').filter(Boolean),r=p[0]||'home',a=p[1];
  const map={home:()=>V.home(),kesfet:()=>V.kesfet(arg),kategori:()=>V.kategori(a),quiz:()=>V.quiz(a),oyna:()=>V.oyna(a),modlar:()=>V.modlar(),sonsuz:()=>V.sonsuz(a),sinav:()=>V.sinav(a),yolculuk:()=>V.yolculuk(),duello:()=>V.duello(),siralamalar:()=>V.siralamalar(arg),gorevler:()=>V.gorevler(),magaza:()=>V.magaza(arg),giris:()=>V.giris(),kayit:()=>V.kayit(),seviye:()=>V.seviye(),profil:()=>V.profil(a),u:()=>V.u(a),oner:()=>V.oner(),yonetim:()=>V.yonetim(a)};
  chrome();
  (map[r]||V.nf)();
  app.focus({preventScroll:true});
}
window.addEventListener('hashchange',route);
window.addEventListener('resize',()=>{const tl=$('#tlogin');if(tl)tl.style.display=innerWidth>=900?'inline-flex':'none'});
load();applyTheme();
if(DB.me&&!DB.users[DB.me])DB.me=null;
route();
</script>
